<!-- ===== GRUP: KATALOG & MASTER ===== -->
<div class="pt-3 pb-1 px-2.5">
    <span class="text-[10px] font-bold uppercase tracking-wider text-neutral-500">Katalog &amp; Master</span>
</div>
<div class="space-y-0.5">
    <!-- Paket Billing -->
    <button onclick="App.switchTab('paket')" data-tab="paket" title="Paket Billing"
        class="tab-btn w-full flex items-start gap-2 px-2.5 py-1.5 rounded text-xs font-semibold text-neutral-400 hover:text-neutral-100 hover:bg-[#121212] transition-all text-left">
        <svg class="w-3.5 h-3.5 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z">
            </path>
        </svg>
        <span class="flex-1 text-left leading-tight break-words">Paket Billing</span>
    </button>

    <!-- Unit PC -->
    <button onclick="App.switchTab('pc')" data-tab="pc" title="Unit PC"
        class="tab-btn w-full flex items-start gap-2 px-2.5 py-1.5 rounded text-xs font-semibold text-neutral-400 hover:text-neutral-100 hover:bg-[#121212] transition-all text-left">
        <svg class="w-3.5 h-3.5 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
            </path>
        </svg>
        <span class="flex-1 text-left leading-tight break-words">Unit PC</span>
    </button>

    <!-- Grup PC / Zona -->
    <button onclick="App.switchTab('grup')" data-tab="grup" title="Grup PC / Zona"
        class="tab-btn w-full flex items-start gap-2 px-2.5 py-1.5 rounded text-xs font-semibold text-neutral-400 hover:text-neutral-100 hover:bg-[#121212] transition-all text-left">
        <svg class="w-3.5 h-3.5 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
            </path>
        </svg>
        <span class="flex-1 text-left leading-tight break-words">Grup PC / Zona</span>
    </button>

    <!-- Kelola Game -->
    {% if session.get('kasir_role') == 'admin' %}
    <button onclick="App.switchTab('game_management')" data-tab="game_management" title="Kelola Game"
        class="tab-btn w-full flex items-start gap-2 px-2.5 py-1.5 rounded text-xs font-semibold text-neutral-400 hover:text-neutral-100 hover:bg-[#121212] transition-all text-left">
        <svg class="w-3.5 h-3.5 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                d="M6 11h4m-2-2v4m7-3h.01m2 2h.01M5 16l1.5-7A3 3 0 019.5 6h5a3 3 0 012.9 2.3l1.6 7a2.5 2.5 0 01-3.4 2.8l-1.9-.9a2 2 0 00-1.8 0l-1.9.9A2.5 2.5 0 015 16z">
            </path>
        </svg>
        <span class="flex-1 text-left leading-tight break-words">Kelola Game</span>
    </button>
    {% endif %}

    <!-- Turnamen -->
    <button onclick="App.switchTab('tournament')" data-tab="tournament" title="Turnamen"
        class="tab-btn w-full flex items-start gap-2 px-2.5 py-1.5 rounded text-xs font-semibold text-neutral-400 hover:text-neutral-100 hover:bg-[#121212] transition-all text-left">
        <svg class="w-3.5 h-3.5 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                d="M5 3v4a5 5 0 004 4.9V15h6v-3.1A5 5 0 0019 7V3H5zm0 0H3m16 0h2m-6 12v3m-4 0h8m-6 3h4">
            </path>
        </svg>
        <span class="flex-1 text-left leading-tight break-words">Turnamen</span>
    </button>
</div>

<!-- ===== GRUP: LAPORAN KEUANGAN ===== -->
<div class="pt-3 pb-1 px-2.5">
    <span class="text-[10px] font-bold uppercase tracking-wider text-neutral-500">Laporan Keuangan</span>
</div>
<div class="space-y-0.5">
    <!-- Laporan Billing -->
    <button onclick="App.switchTab('laporan')" data-tab="laporan" title="Laporan Billing"
        class="tab-btn w-full flex items-start gap-2 px-2.5 py-1.5 rounded text-xs font-semibold text-neutral-400 hover:text-neutral-100 hover:bg-[#121212] transition-all text-left">
        <svg class="w-3.5 h-3.5 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z">
            </path>
        </svg>
        <span class="flex-1 text-left leading-tight break-words">Laporan Billing</span>
    </button>

    <!-- Laporan Kantin -->
    <button onclick="App.switchTab('laporan_menu')" data-tab="laporan_menu" title="Laporan Kantin"
        class="tab-btn w-full flex items-start gap-2 px-2.5 py-1.5 rounded text-xs font-semibold text-neutral-400 hover:text-neutral-100 hover:bg-[#121212] transition-all text-left">
        <svg class="w-3.5 h-3.5 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z">
            </path>
        </svg>
        <span class="flex-1 text-left leading-tight break-words">Laporan Kantin</span>
    </button>

    <!-- Log Stok Menu -->
    <button onclick="App.switchTab('menu_stock_log')" data-tab="menu_stock_log" title="Log Stok Menu"
        class="tab-btn w-full flex items-start gap-2 px-2.5 py-1.5 rounded text-xs font-semibold text-neutral-400 hover:text-neutral-100 hover:bg-[#121212] transition-all text-left">
        <svg class="w-3.5 h-3.5 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4">
            </path>
        </svg>
        <span class="flex-1 text-left leading-tight break-words">Log Stok Menu</span>
    </button>

    <!-- Laporan Perawatan -->
    <button onclick="App.switchTab('laporan_maintenance')" data-tab="laporan_maintenance" title="Laporan Perawatan"
        class="tab-btn w-full flex items-start gap-2 px-2.5 py-1.5 rounded text-xs font-semibold text-neutral-400 hover:text-neutral-100 hover:bg-[#121212] transition-all text-left">
        <svg class="w-3.5 h-3.5 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4">
            </path>
        </svg>
        <span class="flex-1 text-left leading-tight break-words">Laporan Perawatan</span>
    </button>
</div>
