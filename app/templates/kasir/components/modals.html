<!-- ===== MODAL: STRUK ===== -->
<div id="modalStruk" class="hidden fixed inset-0 bg-black/85 flex items-center justify-center z-50 p-4">
    <div class="bg-[#0c0c0c] border border-[#1c1c1c] rounded w-full max-w-sm overflow-hidden shadow-2xl">
        <div id="printArea" class="p-5 sm:p-6 text-neutral-200 text-xs lg:max-xl:text-xs xl:text-base">
            <div class="text-center border-b border-dashed border-[#1c1c1c] pb-4 mb-4">
                <h2 class="text-xs lg:max-xl:text-sm xl:text-base font-bold text-neutral-100 uppercase tracking-wider">MILAN NET</h2>
                <p class="text-[9px] lg:max-xl:text-[10px] xl:text-xs text-neutral-500 mt-1 font-normal">Software Engineering Lab</p>
            </div>
            <div id="isiStruk" class="space-y-2"></div>
            <div
                class="mt-6 pt-4 border-t border-dashed border-[#1c1c1c] text-center text-[9px] lg:max-xl:text-[10px] xl:text-xs text-neutral-500">
                Terima kasih</div>
        </div>
        <div class="flex border-t border-[#1c1c1c] p-4 gap-3 bg-[#0c0c0c]">
            <button onclick="closeStruk()"
                class="flex-1 py-2 lg:max-xl:py-2.5 xl:py-2.5 bg-[#171717] border border-[#262626] hover:bg-[#222] text-neutral-300 text-xs lg:max-xl:text-xs xl:text-base font-bold rounded transition-colors">Tutup</button>
            <button onclick="printStrukNow()"
                class="flex-1 py-2 lg:max-xl:py-2.5 xl:py-2.5 bg-neutral-100 hover:bg-neutral-200 text-black text-xs lg:max-xl:text-xs xl:text-base font-bold rounded transition-colors">Cetak</button>
        </div>
    </div>
</div>

{% if session.get('kasir_role') == 'admin' %}
<!-- ===== MODAL: BACKUP ===== -->
<div id="modal-backup" class="hidden fixed inset-0 bg-black/85 flex items-center justify-center z-50 p-4">
    <div class="bg-[#0c0c0c] border border-[#1c1c1c] rounded p-5 sm:p-6 max-w-md w-full shadow-2xl space-y-4">
        <div class="flex items-center justify-between border-b border-[#1c1c1c] pb-3">
            <h3 class="text-xs lg:max-xl:text-lg xl:text-[22px] font-bold text-neutral-200 uppercase tracking-wider">Pilih Metode Backup</h3>
            <button onclick="Settings.closeBackupModal()"
                class="text-neutral-500 hover:text-neutral-300 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <div class="space-y-3">
            <button onclick="Settings.runServerBackup()"
                class="w-full p-4 bg-[#050505] hover:bg-[#121212] border border-[#1c1c1c] rounded text-left transition-colors">
                <div class="flex items-center gap-3">
                    <div
                        class="w-10 h-10 bg-[#171717] border border-[#262626] text-neutral-300 rounded flex items-center justify-center font-mono font-bold text-xs lg:max-xl:text-sm xl:text-base">
                        SV</div>
                    <div>
                        <div class="text-xs lg:max-xl:text-sm xl:text-base font-bold text-neutral-200 uppercase tracking-wider">Backup ke Server</div>
                        <div class="text-[9px] lg:max-xl:text-[10px] xl:text-xs text-neutral-500 mt-0.5">Simpan di folder server</div>
                    </div>
                </div>
            </button>
            <button onclick="Settings.runLocalBackup()"
                class="w-full p-4 bg-[#050505] hover:bg-[#121212] border border-[#1c1c1c] rounded text-left transition-colors">
                <div class="flex items-center gap-3">
                    <div
                        class="w-10 h-10 bg-[#171717] border border-[#262626] text-neutral-300 rounded flex items-center justify-center font-mono font-bold text-xs lg:max-xl:text-sm xl:text-base">
                        DL</div>
                    <div>
                        <div class="text-xs lg:max-xl:text-sm xl:text-base font-bold text-neutral-200 uppercase tracking-wider">Unduh Database</div>
                        <div class="text-[9px] lg:max-xl:text-[10px] xl:text-xs text-neutral-500 mt-0.5">Download file database</div>
                    </div>
                </div>
            </button>
        </div>
    </div>
</div>
{% endif %}

<!-- ===== MODAL SHARED: PILIH UNIT PC ===== -->
<div id="modal-select-pc"
    class="fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-4 hidden"
    onclick="if(event.target === this) Maintenance.closeSelectPCModal()">
    <div
        class="bg-[#0c0c0c] border border-[#1c1c1c] rounded w-full max-w-xl p-4 sm:p-6 shadow-2xl relative text-xs lg:max-xl:text-xs xl:text-base flex flex-col max-h-[90dvh]">
        <!-- Header -->
        <button onclick="Maintenance.closeSelectPCModal()"
            class="absolute top-4 right-4 text-neutral-500 hover:text-neutral-300 text-lg leading-none">&times;</button>
        <h3 class="text-xs lg:max-xl:text-lg xl:text-[22px] font-bold text-neutral-200 uppercase tracking-wider flex items-center gap-2 mb-4">
            <span>🖥️</span> Pilih Unit PC
        </h3>

        <!-- Search & All PC -->
        <div class="flex items-center gap-3 mb-4">
            <input type="text" id="pc-select-search" oninput="Maintenance.filterPCSelectGrid()" onkeydown="if(event.key === 'Escape') Maintenance.closeSelectPCModal()"
                placeholder="Cari kode PC atau nama..."
                class="flex-1 px-3 py-2 bg-[#050505] border border-[#1c1c1c] rounded text-neutral-200 focus:outline-none focus:border-neutral-500 text-xs lg:max-xl:text-xs xl:text-base">
            <button id="btn-pc-select-all" onclick="Maintenance.selectPCFromModal('', 'Semua PC')"
                class="px-3 lg:max-xl:px-3.5 xl:px-4 py-2 lg:max-xl:py-2.5 xl:py-2.5 bg-[#171717] border border-[#262626] text-neutral-300 font-bold rounded hover:bg-neutral-200 hover:text-black transition-all text-xs lg:max-xl:text-xs xl:text-base whitespace-nowrap">Semua PC</button>
        </div>

        <!-- PC Grid Container -->
        <div id="pc-select-grid-container" class="overflow-y-auto flex-1 scrollbar-thin space-y-4 pr-1">
            <!-- Dinamis via JS -->
        </div>
    </div>
</div>
