<!-- ===== HEADER/NAVBAR ===== -->
<header
    class="h-14 bg-[#0a0a0a] border-b border-[#171717] flex items-center justify-between px-4 md:px-6 sticky top-0 z-20 shrink-0">
    <div class="flex items-center gap-3">
        <button id="navbar-toggle-btn" onclick="Dashboard.toggleSidebar()"
            class="p-1.5 rounded hover:bg-neutral-900 transition-colors text-neutral-400 hover:text-neutral-200 flex items-center justify-center lg:hidden"
            title="Tampilkan Sidebar">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <h2 id="page-title" class="text-sm font-bold text-neutral-100 tracking-wide">Dashboard</h2>
    </div>
    <div class="flex items-center gap-4">
        {% if session.get('kasir_role') == 'admin' %}
        <!-- Branch Selector Dropdown (Admin Only) -->
        <div id="branch-selector-container" class="relative">
            <div id="branch-selector-dropdown" class="relative">
                <button type="button" id="branch-selector-btn" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-[#141414] hover:bg-[#1a1a1a] border border-[#2a2a2a] hover:border-neutral-500 text-neutral-200 transition-all text-xs font-semibold shadow-sm focus:outline-none">
                    <span id="branch-selector-icon" class="w-2 h-2 rounded-full bg-blue-400"></span>
                    <span id="branch-selector-current-label" class="truncate max-w-[130px] sm:max-w-[180px]">Cabang Lokal</span>
                    <svg class="w-3.5 h-3.5 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </button>
                <div id="branch-selector-menu" class="hidden absolute right-0 mt-1.5 w-64 rounded-xl bg-[#0c0c0c] border border-[#262626] shadow-2xl z-50 overflow-hidden backdrop-blur-lg">
                    <div id="branch-selector-list"></div>
                </div>
            </div>
        </div>
        {% endif %}

        <div class="text-right hidden sm:block" data-timezone="{{ user_timezone }}" data-timezone-label="{{ user_timezone_label }}">
            <div class="text-xs font-semibold text-neutral-200 font-mono" id="current-time">--:--</div>
            <div class="text-[9px] text-neutral-500 font-mono" id="current-date">--/--/----</div>
        </div>
    </div>
</header>
