<!-- ===== HEADER/NAVBAR ===== -->
<header
    class="relative h-12 bg-[#0a0a0a] border-b border-[#171717] flex items-center justify-between px-3 md:px-4 sticky top-0 z-20 shrink-0">
    <div class="flex items-center gap-2.5 min-w-0">
        <button id="navbar-toggle-btn" onclick="Dashboard.toggleSidebar()"
            class="p-1 rounded hover:bg-neutral-900 transition-colors text-neutral-400 hover:text-neutral-200 flex items-center justify-center lg:hidden"
            title="Tampilkan Sidebar">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <h2 id="page-title" class="text-xs font-extrabold text-neutral-100 tracking-wide uppercase truncate">Dashboard</h2>
    </div>

    <!-- ===== OMZET HARI INI (DASHBOARD ONLY - CENTERED, DIPISAH BILLING & KANTIN) ===== -->
    <div id="header-omzet-container" class="hidden lg:flex absolute left-1/2 -translate-x-1/2 top-1/2 -translate-y-1/2 items-center gap-1.5 sm:gap-2.5 lg:gap-3 pointer-events-auto">
        <!-- Pill 1: Omzet Billing -->
        <div class="flex items-center gap-1 sm:gap-1.5 px-2 sm:px-3 lg:max-xl:px-3.5 xl:px-3.5 2xl:px-4 py-0.5 sm:py-1 bg-[#0f0f0f]/90 hover:bg-[#151515] border border-[#222222] hover:border-sky-500/40 rounded-full shadow-lg transition-all backdrop-blur-md cursor-pointer group" onclick="App.switchTab('laporan')" title="Klik untuk melihat Laporan Omzet Billing">
            <span class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-sky-400 animate-pulse shadow-sm shadow-sky-400/50 shrink-0"></span>
            <span class="text-[9px] sm:text-[11px] lg:max-xl:text-xs xl:text-xs 2xl:text-xs font-bold text-neutral-400 uppercase tracking-wider whitespace-nowrap">
                <span class="hidden md:inline">Billing:</span>
                <span class="md:hidden">Bill:</span>
            </span>
            <span id="header-omzet-billing" class="text-[10px] sm:text-xs md:text-xs lg:max-xl:text-sm xl:text-sm 2xl:text-base font-black font-mono text-sky-400 tracking-tight whitespace-nowrap group-hover:text-sky-300 transition-colors">
                Rp 0
            </span>
        </div>

        <!-- Pill 2: Omzet Kantin / F&B -->
        <div class="flex items-center gap-1 sm:gap-1.5 px-2 sm:px-3 lg:max-xl:px-3.5 xl:px-3.5 2xl:px-4 py-0.5 sm:py-1 bg-[#0f0f0f]/90 hover:bg-[#151515] border border-[#222222] hover:border-amber-500/40 rounded-full shadow-lg transition-all backdrop-blur-md cursor-pointer group" onclick="App.switchTab('laporan_menu')" title="Klik untuk melihat Laporan Omzet Kantin">
            <span class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-amber-400 animate-pulse shadow-sm shadow-amber-400/50 shrink-0"></span>
            <span class="text-[9px] sm:text-[11px] lg:max-xl:text-xs xl:text-xs 2xl:text-xs font-bold text-neutral-400 uppercase tracking-wider whitespace-nowrap">
                <span class="hidden md:inline">Kantin:</span>
                <span class="md:hidden">Kantin:</span>
            </span>
            <span id="header-omzet-kantin" class="text-[10px] sm:text-xs md:text-xs lg:max-xl:text-sm xl:text-sm 2xl:text-base font-black font-mono text-amber-400 tracking-tight whitespace-nowrap group-hover:text-amber-300 transition-colors">
                Rp 0
            </span>
        </div>
    </div>
    <div class="flex items-center gap-3">
        {% if session.get('kasir_role') == 'admin' %}
        <!-- Branch Selector Dropdown (Admin Only) -->
        <div id="branch-selector-container" class="relative">
            <div id="branch-selector-dropdown" class="relative">
                <button type="button" id="branch-selector-btn" class="flex items-center gap-1.5 px-2.5 py-1 rounded bg-[#141414] hover:bg-[#1a1a1a] border border-[#2a2a2a] hover:border-neutral-500 text-neutral-200 transition-all text-xs font-semibold shadow-sm focus:outline-none">
                    <span id="branch-selector-icon" class="w-1.5 h-1.5 rounded-full bg-blue-400"></span>
                    <span id="branch-selector-current-label" class="truncate max-w-[120px] sm:max-w-[160px]">Cabang Lokal</span>
                    <svg class="w-3 h-3 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </button>
                <div id="branch-selector-menu" class="hidden absolute right-0 mt-1 w-60 rounded-xl bg-[#0c0c0c] border border-[#262626] shadow-2xl z-50 overflow-hidden backdrop-blur-lg">
                    <div id="branch-selector-list"></div>
                </div>
            </div>
        </div>
        {% endif %}

        <div class="text-right hidden sm:block leading-tight" data-timezone="{{ user_timezone }}" data-timezone-label="{{ user_timezone_label }}">
            <div class="text-xs font-bold text-neutral-200 font-mono" id="current-time">--:--</div>
            <div class="text-[9px] text-neutral-500 font-mono" id="current-date">--/--/----</div>
        </div>
    </div>
</header>
