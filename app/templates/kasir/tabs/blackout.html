<!-- ===== TAB: BLACKOUT ===== -->
<div id="tab-blackout" class="tab-content hidden">
    <div class="bg-[#0c0c0c] border border-[#1c1c1c] rounded p-6 space-y-6">
        <!-- Header -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <h3 class="text-xs lg:max-xl:text-lg xl:text-[22px] font-bold text-neutral-200 uppercase tracking-wider flex items-center gap-2">
                <span>⚡</span> Pemulihan Mati Lampu
            </h3>
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <select id="blackout-threshold" class="w-full sm:w-auto px-3 py-2 bg-[#050505] border border-[#1c1c1c] rounded text-xs lg:max-xl:text-xs xl:text-base text-neutral-200 focus:outline-none">
                    <option value="2">2 Menit</option>
                    <option value="5">5 Menit</option>
                    <option value="15">15 Menit</option>
                    <option value="60" selected>60 Menit</option>
                </select>
                <button onclick="Blackout.deteksi()"
                    class="w-full sm:w-auto px-3 lg:max-xl:px-3.5 xl:px-4 py-2 lg:max-xl:py-2.5 xl:py-2.5 bg-amber-600 hover:bg-amber-500 text-white text-xs lg:max-xl:text-xs xl:text-base font-bold rounded transition-colors whitespace-nowrap">Deteksi Blackout</button>
            </div>
        </div>

        <!-- Filter bar -->
        <div class="flex flex-wrap items-center gap-3">
            <select id="blackout-date-picker"
                class="w-full sm:w-auto px-3 py-2 bg-[#050505] border border-[#1c1c1c] rounded text-xs lg:max-xl:text-xs xl:text-base text-neutral-200 focus:outline-none focus:border-neutral-500"></select>
            
            <select id="blackout-type-filter" onchange="Blackout.applyFilters()"
                class="w-full sm:w-auto px-3 py-2 bg-[#050505] border border-[#1c1c1c] rounded text-xs lg:max-xl:text-xs xl:text-base text-neutral-200 focus:outline-none focus:border-neutral-500">
                <option value="all">Semua Tipe</option>
                <option value="member">Member</option>
                <option value="guest">Guest</option>
            </select>
            
            <select id="blackout-group-filter" onchange="Blackout.applyFilters()"
                class="w-full sm:w-auto px-3 py-2 bg-[#050505] border border-[#1c1c1c] rounded text-xs lg:max-xl:text-xs xl:text-base text-neutral-200 focus:outline-none focus:border-neutral-500">
                <option value="all">Semua Grup</option>
            </select>

            <button onclick="Blackout.loadList(document.getElementById('blackout-date-picker').value)"
                class="w-full sm:w-auto px-3 lg:max-xl:px-3.5 xl:px-4 py-2 lg:max-xl:py-2.5 xl:py-2.5 bg-neutral-100 hover:bg-neutral-200 text-black text-xs lg:max-xl:text-xs xl:text-base font-bold rounded transition-colors">Tampilkan</button>
        </div>

        <!-- Content List -->
        <div id="blackout-list">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                {% for _ in range(4) %}
                <div class="bg-[#0c0c0c] border border-[#262626] rounded p-4 relative animate-pulse">
                    <div class="flex items-start gap-3">
                        <div class="w-10 h-10 rounded bg-[#171717] border border-[#262626] shrink-0"></div>
                        <div class="flex-1 min-w-0 space-y-2">
                            <div class="flex items-center gap-2 mb-1">
                                <div class="h-4 bg-[#202020] rounded w-14"></div>
                                <div class="h-4 bg-[#262626] rounded w-24"></div>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="h-3 bg-[#262626] rounded w-12"></div>
                                <div class="h-3 bg-[#1e1e1e] rounded w-16"></div>
                                <div class="h-3 bg-[#1e1e1e] rounded w-20"></div>
                                <div class="h-3 bg-[#262626] rounded w-20"></div>
                            </div>
                        </div>
                    </div>
                    <div class="mt-3 pt-3 border-t border-[#1c1c1c] flex justify-end gap-2">
                        <div class="h-7 bg-[#1c1c1c] rounded w-28"></div>
                        <div class="h-7 bg-[#1c1c1c] rounded w-16"></div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
