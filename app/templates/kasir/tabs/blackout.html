<!-- ===== TAB: BLACKOUT ===== -->
<div id="tab-blackout" class="tab-content hidden space-y-2">
    <div class="bg-[#0c0c0c] border border-[#1c1c1c] rounded p-2 sm:p-2.5 xl:p-3 space-y-2 sm:space-y-2.5">
        <!-- 1. Header Toolbar Terpadu -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div>
                <h3 class="text-xs sm:text-sm xl:text-base font-bold text-neutral-100 flex items-center gap-1.5">
                    <span>⚡</span> Pemulihan Mati Lampu
                </h3>
                <p class="text-[10px] sm:text-xs text-neutral-500">Daftar sesi terputus akibat pemadaman listrik & kompensasi waktu</p>
            </div>
            <div class="flex items-center gap-2">
                <!-- Search Input Live -->
                <div class="relative flex-1 sm:w-44 xl:w-52">
                    <label for="blackout-search-input" class="sr-only">Cari Sesi Blackout</label>
                    <input type="text" id="blackout-search-input" placeholder="Cari PC / User..."
                        class="w-full pl-7 pr-6 py-1 bg-[#050505] border border-[#1c1c1c] rounded text-[11px] sm:text-xs text-neutral-200 placeholder-neutral-500 focus:outline-none focus:border-neutral-500 font-medium"
                        oninput="Blackout.debouncedSearch()"
                        onkeypress="if(event.key === 'Enter') Blackout.doSearch()">
                    <span class="absolute left-2 top-1/2 -translate-y-1/2 text-neutral-500 pointer-events-none">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </span>
                    <button id="blackout-search-clear" onclick="Blackout.clearSearch()" class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-neutral-500 hover:text-neutral-300">✕</button>
                </div>

                <!-- Ambang Batas Selector -->
                <div class="flex items-center gap-1 sm:gap-1.5 shrink-0">
                    <label for="blackout-threshold" class="sr-only">Ambang Batas Deteksi</label>
                    <select id="blackout-threshold"
                        class="px-1.5 sm:px-2 py-1 bg-[#050505] border border-[#1c1c1c] rounded text-[10px] sm:text-xs text-neutral-300 focus:outline-none focus:border-neutral-500 font-medium">
                        <option value="2">2m</option>
                        <option value="5">5m</option>
                        <option value="15">15m</option>
                        <option value="60" selected>60m</option>
                    </select>

                    <!-- Tombol Deteksi Blackout -->
                    <button onclick="Blackout.deteksi()"
                        class="px-2 sm:px-3 py-1 bg-amber-600 hover:bg-amber-500 text-white text-[10px] sm:text-xs font-bold rounded transition-colors flex items-center gap-1 sm:gap-1.5 shadow-sm shrink-0 whitespace-nowrap">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        <span>Deteksi</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 2. Filter Toolbar (2 Baris Rapi & Bebas Berdesakan untuk Semua Breakpoint) -->
        <div class="space-y-1.5 sm:space-y-2">
            <!-- Baris 1: Status Sesi Segmented Tabs & Tombol Bersihkan -->
            <div class="flex flex-wrap sm:flex-nowrap items-center justify-between gap-1.5 sm:gap-2 w-full">
                <div id="blackout-status-tabs" class="flex items-center gap-1 shrink-0">
                    <button type="button" onclick="Blackout.setStatusFilter('all')" data-status="all"
                        class="blackout-status-pill px-2 py-0.5 sm:px-2.5 sm:py-1 rounded text-[10px] sm:text-xs font-bold transition-all flex items-center gap-1.5 shrink-0 bg-[#161616] text-white border border-neutral-400 shadow-sm">
                        <span>Semua</span>
                        <span class="text-[9px] sm:text-[10px] px-1.5 py-0.2 rounded-full bg-neutral-800 text-neutral-200 font-mono">0</span>
                    </button>
                    <button type="button" onclick="Blackout.setStatusFilter('pending')" data-status="pending"
                        class="blackout-status-pill px-2 py-0.5 sm:px-2.5 sm:py-1 rounded text-[10px] sm:text-xs font-bold transition-all flex items-center gap-1.5 shrink-0 bg-[#0a0a0a] text-neutral-400 border border-[#1f1f1f] hover:border-[#333] hover:text-neutral-200">
                        <span class="w-1.5 h-1.5 rounded-full bg-red-500"></span>
                        <span>Menunggu</span>
                        <span class="text-[9px] sm:text-[10px] px-1.5 py-0.2 rounded-full bg-[#161616] text-neutral-500 font-mono">0</span>
                    </button>
                    <button type="button" onclick="Blackout.setStatusFilter('resolved')" data-status="resolved"
                        class="blackout-status-pill px-2 py-0.5 sm:px-2.5 sm:py-1 rounded text-[10px] sm:text-xs font-bold transition-all flex items-center gap-1.5 shrink-0 bg-[#0a0a0a] text-neutral-400 border border-[#1f1f1f] hover:border-[#333] hover:text-neutral-200">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                        <span>Selesai</span>
                        <span class="text-[9px] sm:text-[10px] px-1.5 py-0.2 rounded-full bg-[#161616] text-neutral-500 font-mono">0</span>
                    </button>
                </div>

                <!-- Tombol Bersihkan Selesai -->
                <button id="blackout-btn-clear-resolved" onclick="Blackout.clearResolved()"
                    class="hidden text-[10px] sm:text-[11px] text-red-400 hover:text-red-300 font-bold uppercase tracking-wider transition-colors px-2 py-0.5 sm:px-2.5 sm:py-1 rounded bg-red-950/20 hover:bg-red-500/10 border border-red-800/30 hover:border-red-500/30 whitespace-nowrap">
                    Bersihkan Selesai
                </button>
            </div>

            <!-- Baris 2: Dropdown Filter Kompak (Grid 3 Kolom Proporsional, Anti Hilang ke Kanan) -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-1.5 sm:gap-2 w-full pt-1.5 border-t border-[#191919]">
                <!-- Dropdown Tipe Sesi -->
                <div class="w-full">
                    <label for="blackout-type-select" class="sr-only">Tipe Sesi</label>
                    <select id="blackout-type-select" onchange="Blackout.setTypeFilter(this.value)"
                        class="w-full px-2.5 py-1 bg-[#050505] border border-[#1c1c1c] rounded text-[11px] sm:text-xs text-neutral-200 focus:outline-none focus:border-neutral-500 font-medium">
                        <option value="all">Semua Tipe</option>
                        <option value="member">Member</option>
                        <option value="guest">Guest</option>
                    </select>
                </div>

                <!-- Dropdown Grup PC -->
                <div class="w-full">
                    <label for="blackout-group-select" class="sr-only">Grup PC</label>
                    <select id="blackout-group-select" onchange="Blackout.selectGroup(this.value)"
                        class="w-full px-2.5 py-1 bg-[#050505] border border-[#1c1c1c] rounded text-[11px] sm:text-xs text-neutral-200 focus:outline-none focus:border-neutral-500 font-medium">
                        <option value="all">Semua Grup</option>
                    </select>
                </div>

                <!-- Dropdown Pemilih Tanggal -->
                <div class="w-full">
                    <label for="blackout-date-picker" class="sr-only">Tanggal</label>
                    <select id="blackout-date-picker"
                        class="w-full px-2.5 py-1 bg-[#050505] border border-[#1c1c1c] rounded text-[11px] sm:text-xs text-neutral-200 focus:outline-none focus:border-neutral-500 font-medium"></select>
                </div>
            </div>
        </div>

        <!-- 3. Kontainer Tabel Blackout (Zero Horizontal Scrollbar, Full Adaptive) -->
        <div id="blackout-table-container" class="w-full">
            <div class="w-full overflow-hidden border border-[#1c1c1c] rounded bg-[#080808]">
                <table class="w-full text-xs table-fixed">
                    <thead>
                        <tr class="text-[10px] sm:text-xs text-neutral-400 uppercase border-b border-[#1c1c1c] bg-[#0c0c0c] tracking-wider select-none">
                            <th class="w-[32%] sm:w-[22%] md:w-[17%] lg:w-[14%] xl:w-[14%] 2xl:w-[14%] px-2 sm:px-2.5 py-1.5 text-left font-semibold">Unit PC</th>
                            <th class="hidden sm:table-cell sm:w-[26%] md:w-[23%] lg:w-[16%] xl:w-[17%] 2xl:w-[18%] px-2 sm:px-2.5 py-1.5 text-left font-semibold">Pelanggan</th>
                            <th class="hidden lg:table-cell lg:w-[9%] xl:w-[9%] 2xl:w-[9%] px-2 sm:px-2.5 py-1.5 text-center font-semibold">Tipe</th>
                            <th class="hidden md:table-cell md:w-[18%] lg:w-[15%] xl:w-[15%] 2xl:w-[15%] px-2 sm:px-2.5 py-1.5 text-center font-semibold">Waktu Terputus</th>
                            <th class="w-[28%] sm:w-[22%] md:w-[16%] lg:w-[13%] xl:w-[13%] 2xl:w-[13%] px-2 sm:px-2.5 py-1.5 text-center font-semibold">Sisa Durasi</th>
                            <th class="hidden lg:table-cell lg:w-[9%] xl:w-[9%] 2xl:w-[9%] px-2 sm:px-2.5 py-1.5 text-center font-semibold">Status</th>
                            <th class="w-[40%] sm:w-[30%] md:w-[26%] lg:w-[24%] xl:w-[23%] 2xl:w-[22%] px-2 sm:px-2.5 py-1.5 text-right font-semibold">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="blackout-table-body" class="divide-y divide-[#1c1c1c]">
                        {% for _ in range(6) %}
                        <tr class="animate-pulse">
                            <td class="w-[32%] sm:w-[22%] md:w-[17%] lg:w-[14%] xl:w-[14%] 2xl:w-[14%] px-2 sm:px-2.5 py-1.5 text-left">
                                <div class="h-3.5 bg-[#202020] rounded w-16"></div>
                            </td>
                            <td class="hidden sm:table-cell sm:w-[26%] md:w-[23%] lg:w-[16%] xl:w-[17%] 2xl:w-[18%] px-2 sm:px-2.5 py-1.5 text-left">
                                <div class="h-3.5 bg-[#262626] rounded w-20"></div>
                            </td>
                            <td class="hidden lg:table-cell lg:w-[9%] xl:w-[9%] 2xl:w-[9%] px-2 sm:px-2.5 py-1.5 text-center">
                                <div class="h-3.5 bg-[#202020] rounded w-12 mx-auto"></div>
                            </td>
                            <td class="hidden md:table-cell md:w-[18%] lg:w-[15%] xl:w-[15%] 2xl:w-[15%] px-2 sm:px-2.5 py-1.5 text-center">
                                <div class="h-3.5 bg-[#1e1e1e] rounded w-16 mx-auto"></div>
                            </td>
                            <td class="w-[28%] sm:w-[22%] md:w-[16%] lg:w-[13%] xl:w-[13%] 2xl:w-[13%] px-2 sm:px-2.5 py-1.5 text-center">
                                <div class="h-3.5 bg-[#202020] rounded w-16 mx-auto"></div>
                            </td>
                            <td class="hidden lg:table-cell lg:w-[9%] xl:w-[9%] 2xl:w-[9%] px-2 sm:px-2.5 py-1.5 text-center">
                                <div class="h-3.5 bg-[#202020] rounded-full w-14 mx-auto"></div>
                            </td>
                            <td class="w-[40%] sm:w-[30%] md:w-[26%] lg:w-[24%] xl:w-[23%] 2xl:w-[22%] px-2 sm:px-2.5 py-1.5 text-right">
                                <div class="h-5 bg-[#202020] rounded w-20 ml-auto"></div>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>

            <!-- Pagination Footer -->
            <div id="blackout-pagination-controls" class="mt-1.5"></div>
        </div>
    </div>
</div>
