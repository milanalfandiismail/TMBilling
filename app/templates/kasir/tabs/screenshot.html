<!-- ===== TAB: SCREENSHOT MONITOR ===== -->
<div id="tab-screenshot" class="tab-content hidden space-y-1.5 sm:space-y-2">
    <div class="bg-[#0c0c0c] border border-[#1c1c1c] rounded p-2 sm:p-2.5 xl:p-3 2xl:p-3.5 space-y-2 sm:space-y-2.5">
        <!-- 1. Header Toolbar Terpadu -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-2 2xl:pb-3 border-b border-[#1c1c1c]">
            <div>
                <h3 class="text-xs sm:text-sm 2xl:text-base font-bold text-neutral-100 uppercase tracking-wider">Screenshot Monitor</h3>
                <p class="text-[10px] sm:text-xs 2xl:text-sm text-neutral-500">Pantauan visual real-time layar PC per grup/zona</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <!-- Search Input PC -->
                <div class="relative flex-1 sm:w-44 2xl:w-56">
                    <label for="screenshot-search" class="sr-only">Cari PC</label>
                    <input type="text" id="screenshot-search" placeholder="Cari PC..."
                        class="w-full pl-7 pr-6 py-1.5 2xl:py-2 bg-[#050505] border border-[#1c1c1c] rounded text-[11px] sm:text-xs 2xl:text-sm text-neutral-200 placeholder:text-neutral-600 focus:outline-none focus:border-neutral-500 font-medium">
                    <span class="absolute left-2 top-1/2 -translate-y-1/2 text-neutral-500 pointer-events-none">
                        <svg class="w-3 h-3 2xl:w-3.5 2xl:h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </span>
                    <button id="screenshot-search-clear" onclick="Screenshot.clearSearch()" class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-neutral-500 hover:text-neutral-300 text-[10px] 2xl:text-xs font-bold">✕</button>
                </div>
                
                <!-- Filter Status Screenshot -->
                <label for="screenshot-filter" class="sr-only">Filter Status Screenshot</label>
                <select id="screenshot-filter"
                    class="px-2.5 py-1.5 2xl:py-2 bg-[#050505] border border-[#1c1c1c] rounded text-[11px] sm:text-xs 2xl:text-sm text-neutral-200 focus:outline-none focus:border-neutral-500 font-medium">
                    <option value="all">Semua Status</option>
                    <option value="has_screenshot">Ada Screenshot</option>
                    <option value="no_screenshot">Belum Ada</option>
                </select>

                <!-- Tombol Ambil Screenshot Grup -->
                <button onclick="Screenshot.triggerActiveGroup()" id="btn-trigger-group-screenshot"
                    class="px-2.5 sm:px-3 2xl:px-4 py-1.5 2xl:py-2 bg-neutral-100 hover:bg-white text-black text-xs 2xl:text-sm font-bold rounded transition-colors flex items-center gap-1.5 shadow-sm shrink-0">
                    <svg class="w-3.5 h-3.5 2xl:w-4 2xl:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <span class="hidden sm:inline">Ambil Screenshot Grup</span>
                    <span class="sm:hidden">Ambil Grup</span>
                </button>
            </div>
        </div>

        <!-- 2. Baris Tab Pills Grup Horizontal (Identik Tab Unit PC) -->
        <div id="screenshot-group-tabs" class="flex items-center gap-1.5 2xl:gap-2.5 overflow-x-auto scrollbar-none py-0.5 2xl:py-1">
            <div class="h-7 2xl:h-9 w-20 2xl:w-24 bg-[#161616] rounded animate-pulse"></div>
            <div class="h-7 2xl:h-9 w-16 2xl:w-20 bg-[#161616] rounded animate-pulse"></div>
        </div>

        <!-- 3. Grid Kartu Screenshot Responsif (8 Kolom di 2xl) -->
        <div id="screenshot-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 2xl:grid-cols-8 gap-1.5 sm:gap-2 xl:gap-2 2xl:gap-2.5 w-full overflow-y-auto scrollbar-thin max-h-[calc(100vh-190px)] md:max-h-[calc(100vh-210px)] pr-0.5">
            {% for _ in range(16) %}
            <div class="screenshot-card w-full h-full flex flex-col bg-[#121212] border border-[#1c1c1c] rounded-lg overflow-hidden animate-pulse">
                <div class="p-1.5 px-2 border-b border-[#1c1c1c] flex justify-between items-center bg-[#171717]">
                    <div class="h-3 bg-[#262626] rounded w-12"></div>
                    <div class="h-4 w-4 bg-[#202020] rounded"></div>
                </div>
                <div class="relative w-full aspect-video bg-black flex flex-col items-center justify-center p-2">
                    <div class="w-6 h-6 rounded-full bg-[#1c1c1c] flex items-center justify-center">
                        <svg class="w-3.5 h-3.5 text-[#2a2a2a]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    </div>
                </div>
                <div class="px-2 py-1 text-[10px] flex justify-between items-center bg-[#0c0c0c] border-t border-[#1c1c1c] mt-auto">
                    <div class="h-2 bg-[#202020] rounded w-8"></div>
                    <div class="h-2 bg-[#262626] rounded w-14"></div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

<!-- Modal Lightbox -->
<div id="screenshot-lightbox" class="fixed inset-0 bg-black/90 z-50 hidden flex-col items-center justify-center p-4">
    <div class="w-full max-w-6xl relative">
        <div class="flex justify-between items-center mb-4 text-white">
            <h3 id="lightbox-title" class="text-xs lg:max-xl:text-base xl:text-[22px] font-bold text-neutral-200 uppercase tracking-wider">Screenshot</h3>
            <button onclick="Screenshot.closeLightbox()" class="text-neutral-500 hover:text-neutral-300 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <img id="lightbox-img" src="" alt="Screenshot Full Preview" class="w-full max-h-[80vh] object-contain rounded border border-[#1c1c1c]">
    </div>
</div>
