<!-- ===== TAB: MONITOR ===== -->
<div id="tab-monitor" class="tab-content hidden">
    <div class="bg-[#0c0c0c] border border-[#1c1c1c] rounded p-3 sm:p-4 lg:p-4 xl:p-6">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-4">
            <div>
                <h3 class="text-xs sm:text-base xl:text-[22px] font-bold text-neutral-200 uppercase tracking-wider">Monitor Hardware</h3>
                <p class="text-[9px] lg:max-xl:text-xs xl:text-sm text-neutral-500 mt-0.5">Pemantauan performa real-time sensor CPU, GPU, RAM, dan LAN client.</p>
            </div>
            <div class="flex items-center gap-2 self-start sm:self-center w-full sm:w-auto">
                <label for="monitor-group-filter" class="sr-only">Filter / Urutkan Grup</label>
                <select id="monitor-group-filter" onchange="Monitor.onGroupFilterChange(this.value)"
                    class="w-full sm:w-auto px-3 py-2 bg-[#050505] border border-[#1c1c1c] rounded text-xs lg:max-xl:text-xs xl:text-sm text-neutral-200 focus:outline-none focus:border-neutral-500 font-mono">
                    <option value="all">Semua Grup</option>
                </select>
            </div>
        </div>
        <div id="monitor-table" class="overflow-x-auto w-full">
            <div class="space-y-2.5">
                {% for _ in range(8) %}
                <div class="p-3 bg-[#111] border border-[#1c1c1c] rounded-lg animate-pulse flex items-center justify-between gap-4">
                    <div class="flex items-center gap-3">
                        <div class="h-4 bg-[#262626] rounded w-14"></div>
                        <div class="h-3 bg-[#202020] rounded w-28"></div>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="h-3 bg-[#202020] rounded w-16"></div>
                        <div class="h-3 bg-[#262626] rounded w-16"></div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
