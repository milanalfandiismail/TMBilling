<!-- ===== TAB: DASHBOARD ===== -->
<div id="tab-dash" class="tab-content">
    <!-- ===== OMZET WIDGET (MOBILE & TABLET: SM, MD - DI ATAS SEMUA ZONA) ===== -->
    <div id="dashboard-mobile-omzet" class="flex lg:hidden items-center justify-between gap-2.5 p-2.5 sm:p-3 bg-[#0c0c0c] border border-[#1c1c1c] rounded-xl mb-3 mt-2 shadow-sm">
        <!-- Billing Pill -->
        <div onclick="App.switchTab('laporan')" class="flex-1 flex items-center justify-between gap-2 px-3 py-2 bg-[#070707] hover:bg-[#121212] border border-[#1a1a1a] hover:border-sky-500/40 rounded-lg transition-all cursor-pointer group" title="Lihat Laporan Omzet Billing">
            <div class="flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-sky-400 animate-pulse shadow-sm shadow-sky-400/50 shrink-0"></span>
                <span class="text-[10px] sm:text-xs font-bold text-neutral-400 uppercase tracking-wider">Billing</span>
            </div>
            <span id="dashboard-omzet-billing-mobile" class="text-xs sm:text-sm font-black font-mono text-sky-400 tracking-tight group-hover:text-sky-300">
                Rp 0
            </span>
        </div>

        <!-- Kantin Pill -->
        <div onclick="App.switchTab('laporan_menu')" class="flex-1 flex items-center justify-between gap-2 px-3 py-2 bg-[#070707] hover:bg-[#121212] border border-[#1a1a1a] hover:border-amber-500/40 rounded-lg transition-all cursor-pointer group" title="Lihat Laporan Omzet Kantin">
            <div class="flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse shadow-sm shadow-amber-400/50 shrink-0"></span>
                <span class="text-[10px] sm:text-xs font-bold text-neutral-400 uppercase tracking-wider">Kantin</span>
            </div>
            <span id="dashboard-omzet-kantin-mobile" class="text-xs sm:text-sm font-black font-mono text-amber-400 tracking-tight group-hover:text-amber-300">
                Rp 0
            </span>
        </div>
    </div>

    <div class="flex flex-wrap items-center justify-between gap-3 mb-4 mt-2">
        <div id="dashboard-tabs" class="flex flex-wrap gap-2"></div>
        <div class="flex gap-2">
            <button onclick="Dashboard.tambahWaktuMember()"
                class="px-4 py-2 bg-neutral-100 hover:bg-white text-black text-xs font-bold rounded-lg transition-colors flex items-center gap-2">
                + Tambah Waktu Member
            </button>
            <button onclick="Member.showAddModal()"
                class="px-4 py-2 bg-[#1a1a1a] border border-[#2a2a2a] hover:bg-[#222] hover:border-neutral-500 text-neutral-300 text-xs font-semibold rounded-lg transition-colors flex items-center gap-2">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Tambah Member
            </button>
        </div>
    </div>
    <div id="pc-area">
        <div class="flex items-center justify-center py-20">
            <div class="w-6 h-6 border-2 border-[#2a2a2a] border-t-neutral-100 rounded-full animate-spin"></div>
        </div>
    </div>
</div>
