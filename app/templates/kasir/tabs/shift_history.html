<!-- ===== TAB: RIWAYAT SERAH TERIMA SHIFT ===== -->
<div id="tab-shift_history" class="tab-content hidden space-y-6">
    <!-- Header Card -->
    <div class="bg-[#111] border border-[#1f1f1f] rounded-xl p-5">
        <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
                <h3 class="text-sm lg:max-xl:text-lg xl:text-[22px] font-bold text-neutral-100 tracking-wide flex items-center gap-2">
                    <span class="text-amber-400">📋</span> Riwayat Serah Terima Shift
                </h3>
                <p class="text-[10px] lg:max-xl:text-xs xl:text-base text-neutral-500 mt-0.5">
                    Laporan handover kasir, modal laci, rekonsiliasi selisih tunai & penerimaan multi-metode
                </p>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="Shift.loadHistory()"
                    class="px-3.5 py-2 bg-neutral-800 hover:bg-neutral-700 text-neutral-200 text-xs font-bold rounded-lg transition-colors flex items-center gap-1.5 border border-neutral-700/60">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    Refresh
                </button>
            </div>
        </div>
    </div>

    <!-- Filter Card -->
    <div class="bg-[#111] border border-[#1f1f1f] rounded-xl p-4">
        <div class="flex flex-wrap items-end gap-3">
            <div class="flex-1 min-w-[140px]">
                <label for="filter-shift-mulai" class="text-[10px] uppercase font-bold text-neutral-400 block mb-1">Dari Tanggal</label>
                <input type="date" id="filter-shift-mulai" 
                    class="w-full px-3 py-2 bg-[#0a0a0a] border border-[#2a2a2a] rounded-lg text-neutral-200 text-xs focus:outline-none focus:border-neutral-500 transition-colors">
            </div>
            <div class="flex-1 min-w-[140px]">
                <label for="filter-shift-selesai" class="text-[10px] uppercase font-bold text-neutral-400 block mb-1">Sampai Tanggal</label>
                <input type="date" id="filter-shift-selesai" 
                    class="w-full px-3 py-2 bg-[#0a0a0a] border border-[#2a2a2a] rounded-lg text-neutral-200 text-xs focus:outline-none focus:border-neutral-500 transition-colors">
            </div>
            <div class="w-auto flex items-center gap-2">
                <button onclick="Shift.loadHistory()"
                    class="px-4 py-2 bg-neutral-100 hover:bg-white text-black text-xs font-bold rounded-lg transition-colors shadow-sm">
                    Terapkan Filter
                </button>
                <button onclick="document.getElementById('filter-shift-mulai').value=''; document.getElementById('filter-shift-selesai').value=''; Shift.loadHistory();"
                    class="px-3 py-2 bg-[#1a1a1a] hover:bg-[#222] border border-[#262626] text-neutral-400 text-xs font-bold rounded-lg transition-colors">
                    Reset
                </button>
            </div>
        </div>
    </div>

    <!-- Table Card -->
    <div class="bg-[#111] border border-[#1f1f1f] rounded-xl overflow-hidden">
        <div class="overflow-x-auto w-full">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-[#222] bg-[#0c0c0c] text-[11px] font-bold text-neutral-400 uppercase tracking-wider">
                        <th class="px-3.5 py-3">ID</th>
                        <th class="px-3.5 py-3">Petugas & Waktu</th>
                        <th class="px-3.5 py-3">Modal Awal</th>
                        <th class="px-3.5 py-3">Billing</th>
                        <th class="px-3.5 py-3">Kantin</th>
                        <th class="px-3.5 py-3">Uang Fisik</th>
                        <th class="px-3.5 py-3">Selisih</th>
                        <th class="px-3.5 py-3">Status</th>
                        <th class="px-3.5 py-3 text-right">Aksi</th>
                    </tr>
                </thead>
                <tbody id="shift-history-rows" class="divide-y divide-[#181818]">
                    <tr>
                        <td colspan="9" class="text-center py-8 text-neutral-500 text-xs">
                            Memuat data riwayat shift...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
