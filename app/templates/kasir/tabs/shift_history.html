<!-- ===== TAB: RIWAYAT SERAH TERIMA SHIFT ===== -->
<div id="tab-shift_history" class="tab-content hidden space-y-6">
    <!-- Header Card -->
    <div class="bg-[#0c0c0c] border border-[#1c1c1c] rounded p-4 sm:p-6">
        <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
                <h3 class="text-xs lg:max-xl:text-lg xl:text-[22px] font-bold text-neutral-100 uppercase tracking-wider flex items-center gap-2">
                    <span>📋</span> Riwayat Serah Terima Shift
                </h3>
                <p class="text-[9px] lg:max-xl:text-xs xl:text-base text-neutral-500 mt-1">
                    Laporan handover kasir, modal laci, rekonsiliasi selisih tunai & penerimaan multi-metode
                </p>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="Shift.loadHistory()"
                    class="px-3 lg:max-xl:px-3.5 xl:px-4 py-2 lg:max-xl:py-2.5 xl:py-2.5 bg-[#171717] border border-[#262626] hover:bg-[#222] text-neutral-300 text-xs lg:max-xl:text-xs xl:text-base font-bold rounded transition-colors flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    Refresh
                </button>
            </div>
        </div>
    </div>

    <!-- Filter Card -->
    <div class="bg-[#0c0c0c] border border-[#1c1c1c] rounded p-4 sm:p-6">
        <h3 class="text-xs lg:max-xl:text-lg xl:text-[22px] font-bold text-neutral-200 uppercase tracking-wider mb-4">Filter Periode Shift</h3>
        <div class="flex flex-wrap items-end gap-3">
            <div class="flex-1 min-w-[140px]">
                <label for="filter-shift-mulai" class="text-xs lg:max-xl:text-sm xl:text-base font-bold text-neutral-400 uppercase tracking-wider block mb-1">Dari Tanggal</label>
                <input type="date" id="filter-shift-mulai" 
                    class="w-full px-3 py-2 lg:max-xl:py-2.5 xl:py-2.5 bg-[#050505] border border-[#1c1c1c] rounded text-xs lg:max-xl:text-xs xl:text-base text-neutral-200 focus:outline-none focus:border-neutral-500 transition-colors">
            </div>
            <div class="flex-1 min-w-[140px]">
                <label for="filter-shift-selesai" class="text-xs lg:max-xl:text-sm xl:text-base font-bold text-neutral-400 uppercase tracking-wider block mb-1">Sampai Tanggal</label>
                <input type="date" id="filter-shift-selesai" 
                    class="w-full px-3 py-2 lg:max-xl:py-2.5 xl:py-2.5 bg-[#050505] border border-[#1c1c1c] rounded text-xs lg:max-xl:text-xs xl:text-base text-neutral-200 focus:outline-none focus:border-neutral-500 transition-colors">
            </div>
            <div class="w-auto flex items-center gap-2">
                <button onclick="Shift.loadHistory()"
                    class="px-3 lg:max-xl:px-3.5 xl:px-4 py-2 lg:max-xl:py-2.5 xl:py-2.5 bg-neutral-100 hover:bg-neutral-200 text-black text-xs lg:max-xl:text-xs xl:text-base font-bold rounded transition-colors shadow-sm">
                    Terapkan Filter
                </button>
                <button onclick="document.getElementById('filter-shift-mulai').value=''; document.getElementById('filter-shift-selesai').value=''; Shift.loadHistory();"
                    class="px-3 lg:max-xl:px-3.5 xl:px-4 py-2 lg:max-xl:py-2.5 xl:py-2.5 bg-[#1a1a1a] hover:bg-[#222] border border-[#262626] text-neutral-400 text-xs lg:max-xl:text-xs xl:text-base font-bold rounded transition-colors">
                    Reset
                </button>
            </div>
        </div>
    </div>

    <!-- Table Card -->
    <div class="bg-[#0c0c0c] border border-[#1c1c1c] rounded p-4 sm:p-6 overflow-hidden">
        <h3 class="text-xs lg:max-xl:text-lg xl:text-[22px] font-bold text-neutral-200 uppercase tracking-wider mb-4">Daftar Rekap Shift</h3>
        <div class="overflow-x-auto w-full">
            <table class="w-full text-left border-collapse text-xs lg:max-xl:text-xs xl:text-base">
                <thead>
                    <tr class="border-b border-[#1c1c1c] text-[10px] lg:max-xl:text-xs xl:text-base text-neutral-500 uppercase tracking-wider">
                        <th class="px-4 lg:max-xl:px-4 xl:px-6 py-3 lg:max-xl:py-2.5 xl:py-4">ID</th>
                        <th class="px-4 lg:max-xl:px-4 xl:px-6 py-3 lg:max-xl:py-2.5 xl:py-4">Petugas & Waktu</th>
                        <th class="px-4 lg:max-xl:px-4 xl:px-6 py-3 lg:max-xl:py-2.5 xl:py-4">Modal Awal</th>
                        <th class="px-4 lg:max-xl:px-4 xl:px-6 py-3 lg:max-xl:py-2.5 xl:py-4">Billing</th>
                        <th class="px-4 lg:max-xl:px-4 xl:px-6 py-3 lg:max-xl:py-2.5 xl:py-4">Kantin</th>
                        <th class="px-4 lg:max-xl:px-4 xl:px-6 py-3 lg:max-xl:py-2.5 xl:py-4">Uang Fisik</th>
                        <th class="px-4 lg:max-xl:px-4 xl:px-6 py-3 lg:max-xl:py-2.5 xl:py-4">Selisih</th>
                        <th class="px-4 lg:max-xl:px-4 xl:px-6 py-3 lg:max-xl:py-2.5 xl:py-4">Status</th>
                        <th class="px-4 lg:max-xl:px-4 xl:px-6 py-3 lg:max-xl:py-2.5 xl:py-4 text-right">Aksi</th>
                    </tr>
                </thead>
                <tbody id="shift-history-rows" class="divide-y divide-[#1c1c1c]">
                    <tr>
                        <td colspan="9" class="text-center py-8 text-neutral-500 text-xs lg:text-base">
                            Memuat data riwayat shift...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
