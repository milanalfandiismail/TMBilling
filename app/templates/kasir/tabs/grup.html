<!-- ===== TAB: GRUP ===== -->
<div id="tab-grup" class="tab-content hidden space-y-6">
    <!-- Grup Action Header -->
    <div class="bg-[#111] border border-[#1f1f1f] rounded-xl p-5">
        <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
                <h3 class="text-sm lg:max-xl:text-lg xl:text-[22px] font-bold text-neutral-100 tracking-wide">Grup PC / Zona</h3>
                <p class="text-[10px] lg:max-xl:text-xs xl:text-base text-neutral-500 mt-0.5">Buat kelompok zona PC — setiap grup memiliki paket billing dan tarif tersendiri</p>
            </div>
            {% if session.get('kasir_role') == 'admin' %}
            <button onclick="Grup.showAddModal()"
                class="px-4 py-2.5 bg-neutral-100 hover:bg-white text-black text-xs lg:max-xl:text-xs xl:text-base font-bold rounded-lg transition-colors flex items-center gap-2">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Tambah Grup
            </button>
            {% endif %}
        </div>
    </div>

    <div class="bg-[#111] border border-[#1f1f1f] rounded-xl p-5">
        <h3 class="text-xs lg:max-xl:text-lg xl:text-[22px] font-bold text-neutral-400 uppercase tracking-wider mb-4">Daftar Grup</h3>
        <div id="grup-table" class="overflow-x-auto w-full">
            <table class="w-full text-xs lg:max-xl:text-xs xl:text-base block lg:table">
                <thead class="hidden lg:table-header-group">
                    <tr class="text-[9px] lg:max-xl:text-xs xl:text-base text-neutral-500 uppercase border-b border-[#1c1c1c] tracking-wider">
                        <th class="px-4 lg:max-xl:px-4 xl:px-6 py-3 lg:max-xl:py-3 xl:py-4 text-left">ID</th>
                        <th class="px-4 lg:max-xl:px-4 xl:px-6 py-3 lg:max-xl:py-3 xl:py-4 text-left">Nama Grup</th>
                        <th class="px-4 lg:max-xl:px-4 xl:px-6 py-3 lg:max-xl:py-3 xl:py-4 text-left">Keterangan</th>
                        <th class="px-4 lg:max-xl:px-4 xl:px-6 py-3 lg:max-xl:py-3 xl:py-4 text-right">Aksi</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-[#2a2a2a] lg:divide-[#1c1c1c] block lg:table-row-group">
                    {% for _ in range(5) %}
                    <tr class="border-b border-[#1c1c1c] animate-pulse flex flex-col lg:table-row p-3 lg:p-0">
                        <td class="px-4 lg:max-xl:px-4 xl:px-6 py-3 lg:max-xl:py-3 xl:py-4 text-left"><div class="h-3 bg-[#202020] rounded w-8"></div></td>
                        <td class="px-4 lg:max-xl:px-4 xl:px-6 py-3 lg:max-xl:py-3 xl:py-4 text-left"><div class="h-3.5 bg-[#262626] rounded w-28"></div></td>
                        <td class="px-4 lg:max-xl:px-4 xl:px-6 py-3 lg:max-xl:py-3 xl:py-4 text-left"><div class="h-3 bg-[#1e1e1e] rounded w-44"></div></td>
                        <td class="px-4 lg:max-xl:px-4 xl:px-6 py-3 lg:max-xl:py-3 xl:py-4 text-right"><div class="h-7 w-16 bg-[#202020] rounded ml-auto"></div></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
