<!-- ===== TAB: LAPORAN KANTIN / F&B ===== -->
<div id="tab-laporan_menu" class="tab-content hidden">
    <div class="bg-[#0c0c0c] border border-[#1c1c1c] rounded p-2 sm:p-2.5 xl:p-3 2xl:p-3.5 space-y-1.5 sm:space-y-2">
        <div class="flex flex-wrap items-center justify-between gap-2.5 mb-1.5 xl:mb-2">
            <h3 class="text-xs lg:text-sm xl:text-base 2xl:text-lg font-bold text-neutral-200 uppercase tracking-wider">Laporan Omzet Kantin / F&B</h3>
            <div class="flex flex-wrap items-center gap-1.5 w-full sm:w-auto justify-end">
                <label for="laporan-menu-kasir-select" class="sr-only">Filter Kasir Kantin</label>
                <select id="laporan-menu-kasir-select" onchange="LaporanMenu.filter()"
                    class="flex-1 sm:flex-initial px-2.5 py-1 lg:py-1 xl:py-1.5 2xl:py-2 2xl:px-3.5 bg-[#050505] border border-[#1c1c1c] rounded text-xs xl:text-sm 2xl:text-base text-neutral-200 focus:outline-none focus:border-neutral-500">
                    <option value="">Semua Kasir</option>
                </select>
                <label for="laporan-menu-metode-pembayaran-select" class="sr-only">Filter Metode Pembayaran Kantin</label>
                <select id="laporan-menu-metode-pembayaran-select" onchange="LaporanMenu.filter()"
                    class="flex-1 sm:flex-initial px-2.5 py-1 lg:py-1 xl:py-1.5 2xl:py-2 2xl:px-3.5 bg-[#050505] border border-[#1c1c1c] rounded text-xs xl:text-sm 2xl:text-base text-neutral-200 focus:outline-none focus:border-neutral-500">
                    <option value="">Semua Metode</option>
                </select>
                <label for="laporan-menu-tanggal-select" class="sr-only">Filter Tanggal Laporan Kantin</label>
                <select id="laporan-menu-tanggal-select" onchange="LaporanMenu.filter()"
                    class="flex-1 sm:flex-initial px-2.5 py-1 lg:py-1 xl:py-1.5 2xl:py-2 2xl:px-3.5 bg-[#050505] border border-[#1c1c1c] rounded text-xs xl:text-sm 2xl:text-base text-neutral-200 focus:outline-none focus:border-neutral-500">
                    <option value="">Semua Tanggal</option>
                </select>
                <button onclick="LaporanMenu.exportPDF()"
                    class="w-full sm:w-auto px-3 py-1 lg:py-1 xl:py-1.5 2xl:py-2 2xl:px-4 bg-rose-700 hover:bg-rose-600 text-white text-xs xl:text-sm 2xl:text-base font-bold rounded transition-colors">Export PDF</button>
            </div>
        </div>
        <div id="laporan-menu-area">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2 mb-2.5 animate-pulse">
                <div class="bg-[#111] border border-[#222] p-2.5 rounded-lg space-y-1.5">
                    <div class="h-2 bg-[#202020] rounded w-32"></div>
                    <div class="h-4 bg-[#262626] rounded w-36"></div>
                </div>
                <div class="bg-[#111] border border-[#222] p-2.5 rounded-lg space-y-1.5">
                    <div class="h-2 bg-[#202020] rounded w-28"></div>
                    <div class="h-4 bg-[#262626] rounded w-16"></div>
                </div>
            </div>
            <div class="space-y-2">
                <div class="border border-[#1c1c1c] rounded overflow-hidden">
                    <table class="w-full text-xs xl:text-sm">
                        <thead class="bg-[#0c0c0c] hidden lg:table-header-group">
                            <tr class="border-b border-[#1c1c1c] text-neutral-500 text-[10px] xl:text-xs uppercase font-bold tracking-wider">
                                <th class="px-3 xl:px-4 py-2 text-left">Waktu</th>
                                <th class="px-3 xl:px-4 py-2 text-left">Nota</th>
                                <th class="px-3 xl:px-4 py-2 text-left">Item Menu</th>
                                <th class="px-3 xl:px-4 py-2 text-center">Qty</th>
                                <th class="px-3 xl:px-4 py-2 text-right">Total</th>
                                <th class="px-3 xl:px-4 py-2 text-left">Metode</th>
                                <th class="px-3 xl:px-4 py-2 text-left">Pemesanan</th>
                                <th class="px-3 xl:px-4 py-2 text-left">Kasir</th>
                                <th class="px-3 xl:px-4 py-2 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-[#1c1c1c] bg-[#050505] block lg:table-row-group">
                            {% for _ in range(5) %}
                            <tr class="animate-pulse flex flex-col lg:table-row p-2.5 lg:p-0">
                                <td class="px-3 xl:px-4 py-2 text-left"><div class="h-2.5 bg-[#1e1e1e] rounded w-20"></div></td>
                                <td class="px-3 xl:px-4 py-2 text-left"><div class="h-3 bg-[#262626] rounded w-24"></div></td>
                                <td class="px-3 xl:px-4 py-2 text-left"><div class="h-3 bg-[#262626] rounded w-32"></div></td>
                                <td class="px-3 xl:px-4 py-2 text-center"><div class="h-2.5 bg-[#202020] rounded w-8 mx-auto"></div></td>
                                <td class="px-3 xl:px-4 py-2 text-right"><div class="h-3 bg-[#262626] rounded w-16 ml-auto"></div></td>
                                <td class="px-3 xl:px-4 py-2 text-left"><div class="h-3 bg-[#202020] rounded w-12"></div></td>
                                <td class="px-3 xl:px-4 py-2 text-left"><div class="h-2.5 bg-[#1e1e1e] rounded w-14"></div></td>
                                <td class="px-3 xl:px-4 py-2 text-left"><div class="h-2.5 bg-[#1e1e1e] rounded w-14"></div></td>
                                <td class="px-3 xl:px-4 py-2 text-center"><div class="h-6 w-10 bg-[#202020] rounded mx-auto"></div></td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <!-- Modal Detail Item Pesanan Kantin -->
    <div id="modal-laporan-menu-detail" class="hidden fixed inset-0 z-[9999] bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4">
        <div class="bg-[#0d0d0d] border border-[#222] rounded-lg max-w-lg w-full p-4 sm:p-5 space-y-3.5 shadow-2xl relative animate-in fade-in zoom-in-95 duration-150">
            <!-- Modal Header -->
            <div class="flex items-center justify-between border-b border-[#1c1c1c] pb-3">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded bg-[#171717] border border-[#262626] flex items-center justify-center text-amber-400">
                        <i class="fa-solid fa-utensils text-sm"></i>
                    </div>
                    <div>
                        <h3 class="text-sm sm:text-base font-bold text-neutral-200">Rincian Item Pesanan Kantin</h3>
                        <p class="text-[10px] sm:text-[11px] text-neutral-400 font-mono mt-0.5" id="modal-menu-nota-waktu">-</p>
                    </div>
                </div>
                <button type="button" onclick="LaporanMenu.closeDetailItemsModal()" class="w-7 h-7 rounded bg-[#141414] hover:bg-neutral-800 text-neutral-400 hover:text-white flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>

            <!-- Chips Summary -->
            <div class="grid grid-cols-3 gap-2">
                <div class="bg-[#050505] border border-[#1c1c1c] rounded p-2 text-center">
                    <span class="text-[9px] text-neutral-500 uppercase font-bold tracking-wider block">Total Menu</span>
                    <span id="modal-menu-total-item" class="text-xs sm:text-sm font-mono font-bold text-neutral-200 block mt-0.5">0 Menu</span>
                </div>
                <div class="bg-[#050505] border border-[#1c1c1c] rounded p-2 text-center">
                    <span class="text-[9px] text-neutral-500 uppercase font-bold tracking-wider block">Total Qty</span>
                    <span id="modal-menu-total-qty" class="text-xs sm:text-sm font-mono font-bold text-neutral-300 block mt-0.5">0 Pcs</span>
                </div>
                <div class="bg-[#050505] border border-[#1c1c1c] rounded p-2 text-center">
                    <span class="text-[9px] text-neutral-500 uppercase font-bold tracking-wider block">Total Bayar</span>
                    <span id="modal-menu-total-harga" class="text-xs sm:text-sm font-mono font-bold text-emerald-400 block mt-0.5">Rp0</span>
                </div>
            </div>

            <!-- Itemized Table / List -->
            <div class="space-y-1.5">
                <label class="text-[10px] text-neutral-400 uppercase font-bold tracking-wider block">Daftar Menu Yang Dipesan</label>
                <div class="bg-[#050505] border border-[#1c1c1c] rounded max-h-60 overflow-y-auto">
                    <table class="w-full text-left text-xs border-collapse">
                        <thead class="bg-[#0c0c0c] border-b border-[#1c1c1c] text-neutral-500 text-[9px] sm:text-[10px] uppercase font-bold sticky top-0">
                            <tr>
                                <th class="px-3 py-1.5 text-left w-8">#</th>
                                <th class="px-3 py-1.5 text-left">Nama Menu</th>
                                <th class="px-3 py-1.5 text-center w-14">Qty</th>
                                <th class="px-3 py-1.5 text-right w-24">Harga</th>
                                <th class="px-3 py-1.5 text-right w-24">Subtotal</th>
                            </tr>
                        </thead>
                        <tbody id="modal-menu-items-table" class="divide-y divide-[#171717] font-mono text-neutral-300 text-[11px]">
                            <!-- Populated dynamically via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="flex items-center justify-between border-t border-[#1c1c1c] pt-3">
                <button type="button" id="modal-menu-print-btn" onclick="" class="px-3 py-1.5 rounded text-xs font-bold bg-neutral-900 hover:bg-neutral-800 text-neutral-200 border border-[#2a2a2a] transition-colors flex items-center gap-1.5">
                    <i class="fa-solid fa-print text-neutral-400 text-xs"></i>
                    <span>Cetak Struk</span>
                </button>
                <button type="button" onclick="LaporanMenu.closeDetailItemsModal()" class="px-4 py-1.5 rounded text-xs font-bold bg-neutral-200 hover:bg-white text-black transition-colors">
                    Tutup
                </button>
            </div>
        </div>
    </div>

</div>
