<!-- ===== TAB: REMOTE SERVER (VNC) ===== -->
<div id="tab-remote_server" class="tab-content hidden w-full h-[calc(100vh-140px)] flex flex-col min-h-0">
    <div class="bg-[#0c0c0c] border border-[#1c1c1c] rounded-xl p-3 md:p-4 flex flex-col h-full space-y-3 overflow-hidden">
        
        <!-- Header Toolbar adaptif -->
        <div class="flex flex-col gap-2.5 pb-2.5 border-b border-[#1c1c1c] shrink-0">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                <div class="flex items-center gap-3 min-w-0">
                    <div class="w-10 h-10 rounded bg-[#171717] border border-[#262626] flex items-center justify-center shrink-0">
                        <span class="text-xl">📡</span>
                    </div>
                    <div class="min-w-0">
                        <h3 class="text-xs lg:text-[22px] font-bold text-neutral-200 uppercase tracking-wider whitespace-nowrap">Remote Control</h3>
                        <p class="text-[9px] lg:text-base text-neutral-500 mt-0.5 whitespace-nowrap hidden sm:block">Pemantauan & kendali jarak jauh layar server utama</p>
                    </div>
                </div>
                
                <!-- Status & Action Buttons Utama -->
                <div class="flex flex-wrap items-center gap-2 mt-1 md:mt-0">
                    <!-- Status Badge -->
                    <span id="vnc-status-badge" class="px-2 py-1 md:px-3 md:py-1.5 rounded text-[10px] md:text-xs font-semibold bg-neutral-800 text-neutral-400 border border-neutral-700">
                        Terputus
                    </span>

                    <!-- Resolution & Mode HUD Badge -->
                    <span id="vnc-resolution-badge" class="hidden px-2 py-1 md:px-2.5 md:py-1.5 rounded text-[10px] md:text-xs font-mono font-semibold bg-[#141414] text-neutral-300 border border-[#262626]">
                        —
                    </span>
                    
                    <button onclick="VNCClient.connect()" id="vnc-connect-btn"
                        class="px-3 py-1.5 md:px-4 md:py-1.5 bg-neutral-100 hover:bg-neutral-200 text-black text-xs md:text-sm font-bold rounded transition-colors flex items-center gap-1">
                        <span>▶</span> <span class="hidden sm:inline">Hubungkan</span>
                    </button>
                    <button onclick="VNCClient.disconnect()" id="vnc-disconnect-btn"
                        class="px-3 py-1.5 md:px-4 md:py-1.5 bg-red-600/80 hover:bg-red-500 text-white text-xs md:text-sm font-bold rounded transition-colors hidden flex items-center gap-1">
                        <span>⏹</span> <span class="hidden sm:inline">Putuskan</span>
                    </button>
                    
                    <!-- Toggle Keyboard Button -->
                    <button onclick="VNCClient.toggleVirtualKeyboard()" id="vnc-toggle-kb-btn"
                        class="px-2.5 py-1.5 md:px-3 md:py-1.5 bg-[#171717] hover:bg-[#222] border border-[#262626] text-neutral-300 text-xs md:text-sm font-bold rounded transition-colors flex items-center gap-1.5"
                        title="Tampilkan / Sembunyikan Keyboard Virtual">
                        <span>⌨️</span> <span class="hidden sm:inline">Keyboard</span>
                    </button>
                    <button onclick="VNCClient.toggleMobileOptions()" id="vnc-toggle-options-btn"
                        class="md:hidden px-3 py-1.5 bg-[#171717] border border-[#262626] text-neutral-300 text-xs font-bold rounded transition-colors"
                        title="Tampilkan Pengaturan VNC">
                        ⚙️
                    </button>
                </div>
            </div>

            <!-- Desktop-only Controls & Mobile Collapsible Options Panel -->
            <div id="vnc-options-panel" class="hidden md:flex flex-wrap items-center justify-between gap-3 bg-[#070707] md:bg-transparent p-3 md:p-0 rounded-lg md:rounded-none border border-[#1c1c1c] md:border-none">
                <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                    <!-- Password Field Group -->
                    <div class="flex items-center gap-2 w-full sm:w-auto">
                        <input type="password" id="vnc-password-input" placeholder="Password TightVNC"
                            class="flex-1 sm:flex-none w-full sm:w-44 px-3 py-1.5 bg-[#050505] border border-[#1c1c1c] rounded text-xs lg:text-sm text-neutral-200 focus:outline-none focus:border-neutral-500 font-mono">
                        <button onclick="VNCClient.saveGlobalPassword()" id="vnc-save-pw-btn"
                            class="px-3 py-1.5 bg-[#171717] hover:bg-[#222] border border-[#262626] text-neutral-300 text-xs lg:text-sm font-bold rounded transition-colors flex items-center gap-1.5 shrink-0"
                            title="Simpan Password ke Database">
                            <span>💾</span> Simpan PW
                        </button>
                    </div>
                </div>

                <div class="flex items-center gap-2 w-full md:w-auto justify-end">
                    <button onclick="VNCClient.toggleScale()" id="vnc-scale-btn"
                        class="flex-1 md:flex-none px-3 py-1.5 bg-[#171717] border border-[#262626] hover:bg-[#222] text-neutral-300 text-xs lg:text-sm font-bold rounded transition-colors whitespace-nowrap flex items-center gap-1.5 justify-center"
                        title="Ubah Mode Tampilan (Fit Layar / Ukuran Asli 1:1)">
                        <span>📐</span> <span id="vnc-scale-label">Fit Layar</span>
                    </button>
                    <button onclick="VNCClient.toggleFullscreen()" id="vnc-fullscreen-btn"
                        class="flex-1 md:flex-none px-3 py-1.5 bg-[#171717] border border-[#262626] hover:bg-[#222] text-neutral-300 text-xs lg:text-sm font-bold rounded transition-colors whitespace-nowrap flex items-center gap-1.5 justify-center">
                        <span>⛶</span> Fullscreen
                    </button>
                </div>
            </div>
        </div>

        <!-- Canvas Container -->
        <div id="vnc-container"
            class="relative w-full flex-1 min-h-0 bg-[#050505] rounded-lg border border-[#1c1c1c] overflow-hidden flex items-center justify-center select-none">
            <div id="vnc-screen" class="w-full h-full overflow-hidden flex items-center justify-center"></div>
            <div id="vnc-placeholder"
                class="absolute inset-0 flex flex-col items-center justify-center bg-[#070707] text-neutral-500 space-y-3 z-10 p-4 text-center">
                <svg class="w-12 h-12 stroke-neutral-700" fill="none" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
                <p class="text-xs lg:text-base font-semibold text-neutral-400">Klik "Hubungkan" untuk memulai Sesi Remote VNC Server</p>
                <p class="text-[10px] lg:text-xs text-neutral-600">Mendukung mode Scaling adaptif (Fit Layar) dan 1:1 Pixel Native dengan akurasi kursor penuh</p>
            </div>
        </div>

        <!-- Virtual QWERTY Keyboard Dock -->
        <div id="vnc-virtual-keyboard" class="hidden bg-[#0a0a0a] border border-[#1c1c1c] rounded-lg p-2 md:p-2.5 space-y-2 shrink-0 select-none">
            <!-- Header Tab Selector & Tutup -->
            <div class="flex items-center justify-between border-b border-[#1c1c1c] pb-1.5">
                <div class="flex items-center gap-1.5">
                    <button onclick="VNCClient.switchKeyboardLayout('letters')" id="vnc-kb-tab-letters"
                        class="px-3 py-1 text-[10px] font-bold rounded bg-neutral-200 text-black transition-colors">
                        Abc
                    </button>
                    <button onclick="VNCClient.switchKeyboardLayout('symbols')" id="vnc-kb-tab-symbols"
                        class="px-3 py-1 text-[10px] font-bold rounded bg-[#171717] border border-[#262626] text-neutral-400 hover:bg-[#222] transition-colors">
                        123 / Simbol
                    </button>
                    <button onclick="VNCClient.switchKeyboardLayout('function')" id="vnc-kb-tab-function"
                        class="px-3 py-1 text-[10px] font-bold rounded bg-[#171717] border border-[#262626] text-neutral-400 hover:bg-[#222] transition-colors">
                        Fn (F1-F12)
                    </button>
                </div>
                <div class="flex items-center gap-1">
                    <button onclick="VNCClient.sendCtrlAltDel()"
                        class="px-2 py-1 bg-red-950/40 hover:bg-red-900/40 border border-red-900/60 text-red-400 text-[10px] font-bold rounded transition-colors">
                        CAD
                    </button>
                    <button onclick="VNCClient.toggleVirtualKeyboard()"
                        class="px-2.5 py-1 bg-[#171717] hover:bg-[#222] border border-[#262626] text-neutral-300 text-[10px] font-bold rounded transition-colors">
                        Tutup
                    </button>
                </div>
            </div>

            <!-- Dynamic Keys Layout Grid (Rendered by JS) -->
            <div id="vnc-kb-keys-grid" class="flex flex-col gap-1 w-full font-mono"></div>

            <!-- Persistent Modifiers & Directional Controls -->
            <div class="flex items-center justify-between gap-3 border-t border-[#1c1c1c] pt-2">
                <div class="flex items-center gap-1 flex-1">
                    <button id="vnc-key-ctrl" onclick="VNCClient.toggleModifier('Ctrl')"
                        class="flex-1 py-1.5 bg-[#171717] border border-[#262626] text-neutral-400 text-[10px] font-bold rounded transition-colors">
                        Ctrl
                    </button>
                    <button id="vnc-key-alt" onclick="VNCClient.toggleModifier('Alt')"
                        class="flex-1 py-1.5 bg-[#171717] border border-[#262626] text-neutral-400 text-[10px] font-bold rounded transition-colors">
                        Alt
                    </button>
                    <button id="vnc-key-win" onclick="VNCClient.toggleModifier('Win')"
                        class="flex-1 py-1.5 bg-[#171717] border border-[#262626] text-neutral-400 text-[10px] font-bold rounded transition-colors">
                        Win
                    </button>
                </div>

                <!-- Short Shortcuts & Arrow Keys -->
                <div class="flex items-center gap-2 shrink-0">
                    <div class="flex items-center gap-0.5">
                        <button onclick="VNCClient.sendSpecialKey(0xff51)" class="w-8 py-1.5 bg-[#1c1c1c] hover:bg-[#252525] text-neutral-300 text-center rounded text-xs">◀</button>
                        <div class="flex flex-col gap-0.5">
                            <button onclick="VNCClient.sendSpecialKey(0xff52)" class="w-8 py-1 bg-[#1c1c1c] hover:bg-[#252525] text-neutral-300 text-center rounded text-[10px]">▲</button>
                            <button onclick="VNCClient.sendSpecialKey(0xff54)" class="w-8 py-1 bg-[#1c1c1c] hover:bg-[#252525] text-neutral-300 text-center rounded text-[10px]">▼</button>
                        </div>
                        <button onclick="VNCClient.sendSpecialKey(0xff53)" class="w-8 py-1.5 bg-[#1c1c1c] hover:bg-[#252525] text-neutral-300 text-center rounded text-xs">▶</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
