<!-- ===== TAB: PAKET ===== -->
<div id="tab-paket" class="tab-content hidden space-y-6">
    <!-- Paket Action Header -->
    <div class="bg-[#111] border border-[#1f1f1f] rounded-xl p-5">
        <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
                <h3 class="text-sm lg:max-xl:text-lg xl:text-[22px] font-bold text-neutral-100 tracking-wide">Paket Billing</h3>
                <p class="text-[10px] lg:max-xl:text-xs xl:text-base text-neutral-500 mt-0.5">Kelola paket waktu bermain: atur durasi, harga, dan masa berlaku per grup</p>
            </div>
            {% if session.get('kasir_role') == 'admin' %}
            <button onclick="Paket.showAddModal()"
                class="remote-hide-action px-4 py-2.5 bg-neutral-100 hover:bg-white text-black text-xs lg:max-xl:text-xs xl:text-base font-bold rounded-lg transition-colors flex items-center gap-2">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Tambah Paket
            </button>
            {% endif %}
        </div>
    </div>

    <div class="bg-[#111] border border-[#1f1f1f] rounded-xl p-5">
        <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
            <h3 class="text-xs lg:max-xl:text-lg xl:text-[22px] font-bold text-neutral-400 uppercase tracking-wider">Daftar Paket</h3>
            <div class="flex flex-wrap items-center gap-2">
                <label for="paket-search-input" class="sr-only">Cari Nama Paket</label>
                <input type="text" id="paket-search-input" placeholder="Cari nama paket..."
                    class="px-3 py-2 bg-[#0a0a0a] border border-[#2a2a2a] rounded-lg text-xs lg:max-xl:text-xs xl:text-base text-neutral-200 placeholder-neutral-600 focus:outline-none focus:border-neutral-500 w-40"
                    oninput="Paket.debouncedSearch()"
                    onkeypress="if(event.key === 'Enter') Paket.doSearch()">
                <label for="paket-grup-filter-select" class="sr-only">Filter Grup Paket</label>
                <select id="paket-grup-filter-select"
                    class="px-3 py-2 bg-[#0a0a0a] border border-[#2a2a2a] rounded-lg text-xs lg:max-xl:text-xs xl:text-base text-neutral-200 focus:outline-none focus:border-neutral-500"
                    onchange="Paket.doSearch()">
                    <option value="">Semua Grup</option>
                </select>
                <button onclick="Paket.doSearch()"
                    class="px-4 py-2 bg-neutral-100 hover:bg-white text-black text-xs lg:max-xl:text-xs xl:text-base font-bold rounded-lg transition-colors">Cari</button>
                <button onclick="Paket.clearSearch()"
                    class="px-4 py-2 bg-[#1a1a1a] border border-[#2a2a2a] hover:bg-[#222] text-neutral-300 text-xs lg:max-xl:text-xs xl:text-base font-bold rounded-lg transition-colors">Reset</button>
            </div>
        </div>
        <div id="paket-table" class="overflow-x-auto w-full">
            {% for _ in range(2) %}
            <div class="space-y-3 {% if not loop.first %}mt-8{% endif %}">
                <div class="flex items-center gap-3 mb-4 pb-3 border-b border-[#1c1c1c] animate-pulse">
                    <div class="h-4 bg-[#262626] rounded w-32"></div>
                    <div class="h-4 bg-[#1e1e1e] rounded w-16"></div>
                </div>
                <table class="w-full text-xs lg:max-xl:text-xs xl:text-base block lg:table">
                    <thead class="hidden lg:table-header-group">
                        <tr class="border-b border-[#262626] text-neutral-400">
                            <th class="px-4 py-3 text-left font-medium w-2/5">Nama</th>
                            <th class="px-4 py-3 text-left font-medium w-1/5">Durasi</th>
                            <th class="px-4 py-3 text-left font-medium w-1/5">Harga</th>
                            <th class="px-4 py-3 text-left font-medium w-1/6">Masa Aktif</th>
                            <th class="px-4 py-3 text-right font-medium w-24 remote-hide-action">Aksi</th>
                        </tr>
                    </thead>
                    <tbody class="block lg:table-row-group divide-y divide-[#1c1c1c]">
                        {% for _ in range(3) %}
                        <tr class="border-b border-[#1c1c1c] animate-pulse flex flex-col lg:table-row p-3 lg:p-0">
                            <td class="px-4 py-3 text-left">
                                <div class="h-3.5 bg-[#262626] rounded w-36"></div>
                            </td>
                            <td class="px-4 py-3 text-left">
                                <div class="h-3 bg-[#202020] rounded w-20"></div>
                            </td>
                            <td class="px-4 py-3 text-left">
                                <div class="h-3.5 bg-[#262626] rounded w-24"></div>
                            </td>
                            <td class="px-4 py-3 text-left">
                                <div class="h-3 bg-[#1e1e1e] rounded w-16"></div>
                            </td>
                            <td class="px-4 py-3 text-right">
                                <div class="flex items-center justify-end gap-2">
                                    <div class="h-7 w-7 bg-[#202020] rounded"></div>
                                    <div class="h-7 w-7 bg-[#202020] rounded"></div>
                                </div>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
