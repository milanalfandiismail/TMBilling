<!-- ===== TAB: PAKET ===== -->
<div id="tab-paket" class="tab-content hidden space-y-2 sm:space-y-2.5">
    <div class="bg-[#0c0c0c] border border-[#1c1c1c] rounded p-2.5 sm:p-3 xl:p-3.5 2xl:p-5 space-y-2.5 2xl:space-y-4">
        <!-- 1. Header Toolbar Terpadu -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-2 2xl:pb-3 border-b border-[#1c1c1c]">
            <div>
                <h3 class="text-xs sm:text-sm 2xl:text-base font-bold text-neutral-100 uppercase tracking-wider">Paket Billing</h3>
                <p class="text-[10px] sm:text-xs 2xl:text-sm text-neutral-500">Kelola durasi, tarif harga, dan masa aktif paket bermain</p>
            </div>
            <div class="flex items-center gap-2">
                <div class="relative flex-1 sm:w-48 2xl:w-64">
                    <label for="paket-search-input" class="sr-only">Cari Nama Paket</label>
                    <input type="text" id="paket-search-input" placeholder="Cari paket..."
                        class="w-full pl-7 2xl:pl-8 pr-6 2xl:pr-7 py-1.5 2xl:py-2 bg-[#050505] border border-[#1c1c1c] rounded text-[11px] sm:text-xs 2xl:text-sm text-neutral-200 placeholder:text-neutral-600 focus:outline-none focus:border-neutral-500 font-medium"
                        oninput="Paket.debouncedSearch()"
                        onkeypress="if(event.key === 'Enter') Paket.doSearch()">
                    <span class="absolute left-2 2xl:left-2.5 top-1/2 -translate-y-1/2 text-neutral-500 pointer-events-none">
                        <svg class="w-3 h-3 2xl:w-3.5 2xl:h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </span>
                    <button id="paket-search-clear" onclick="Paket.clearSearch()" class="hidden absolute right-2 2xl:right-2.5 top-1/2 -translate-y-1/2 text-neutral-500 hover:text-neutral-300 text-[10px] 2xl:text-xs font-bold">✕</button>
                </div>
                {% if session.get('kasir_role') == 'admin' %}
                <button onclick="Paket.showAddModal()"
                    class="remote-hide-action px-2.5 sm:px-3 2xl:px-4 py-1.5 2xl:py-2 bg-neutral-100 hover:bg-white text-black text-xs 2xl:text-sm font-bold rounded transition-colors flex items-center gap-1.5 2xl:gap-2 shrink-0 shadow-sm">
                    <svg class="w-3.5 h-3.5 2xl:w-4 2xl:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    <span class="hidden sm:inline">Tambah Paket</span>
                    <span class="sm:hidden">Tambah</span>
                </button>
                {% endif %}
            </div>
        </div>

        <!-- 2. Baris Tab Pills Grup Horizontal -->
        <div id="paket-group-tabs" class="flex items-center gap-1.5 2xl:gap-2.5 overflow-x-auto scrollbar-none py-0.5 2xl:py-1">
            <!-- Render pills dinamis: Reguler, VIP, VVIP dll -->
            <div class="h-7 2xl:h-9 w-20 2xl:w-24 bg-[#161616] rounded animate-pulse"></div>
            <div class="h-7 2xl:h-9 w-16 2xl:w-20 bg-[#161616] rounded animate-pulse"></div>
        </div>

        <!-- 3. Kontainer Tabel Paket & Pagination -->
        <div id="paket-table" class="w-full">
            <div class="overflow-x-auto w-full border border-[#1c1c1c] rounded">
                <table class="w-full text-xs 2xl:text-sm">
                    <thead>
                        <tr class="text-[10px] sm:text-xs 2xl:text-sm text-neutral-500 uppercase tracking-wider border-b border-[#1c1c1c] bg-[#0c0c0c]">
                            <th class="px-2.5 sm:px-3 2xl:px-4 py-2 2xl:py-3 text-left font-bold w-2/5 sm:w-1/3">Paket</th>
                            <th class="px-2 sm:px-3 2xl:px-4 py-2 2xl:py-3 text-center font-bold w-1/4 sm:w-1/5">Durasi</th>
                            <th class="px-2 sm:px-3 2xl:px-4 py-2 2xl:py-3 text-center font-bold w-1/4 sm:w-1/5">Harga</th>
                            <th class="hidden sm:table-cell px-2 sm:px-3 2xl:px-4 py-2 2xl:py-3 text-center font-bold w-1/6">Masa Aktif</th>
                            <th class="px-2 sm:px-3 2xl:px-4 py-2 2xl:py-3 text-right font-bold w-16 sm:w-20 2xl:w-24 remote-hide-action">Aksi</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-[#1a1a1a]">
                        {% for _ in range(5) %}
                        <tr class="animate-pulse">
                            <td class="px-2.5 sm:px-3 2xl:px-4 py-2 2xl:py-3 text-left"><div class="h-3 2xl:h-4 bg-[#1e1e1e] rounded w-28 sm:w-36 2xl:w-48"></div></td>
                            <td class="px-2 sm:px-3 2xl:px-4 py-2 2xl:py-3 text-center"><div class="h-3 2xl:h-4 bg-[#181818] rounded w-14 2xl:w-16 mx-auto"></div></td>
                            <td class="px-2 sm:px-3 2xl:px-4 py-2 2xl:py-3 text-center"><div class="h-3 2xl:h-4 bg-[#1e1e1e] rounded w-16 2xl:w-20 mx-auto"></div></td>
                            <td class="hidden sm:table-cell px-2 sm:px-3 2xl:px-4 py-2 2xl:py-3 text-center"><div class="h-3 2xl:h-4 bg-[#181818] rounded w-12 2xl:w-16 mx-auto"></div></td>
                            <td class="px-2 sm:px-3 2xl:px-4 py-2 2xl:py-3 text-right remote-hide-action"><div class="h-5 2xl:h-6 w-12 2xl:w-14 bg-[#181818] rounded ml-auto"></div></td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
