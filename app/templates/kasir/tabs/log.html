<!-- ===== TAB: LOG ===== -->
<div id="tab-log" class="tab-content hidden">
    <div class="bg-[#0c0c0c] border border-[#1c1c1c] rounded p-6">
        <div class="flex flex-wrap gap-3 mb-4">
            <!-- Kategori tab bar -->
            <div class="flex gap-1 bg-[#050505] border border-[#1c1c1c] rounded-lg p-1 w-full overflow-x-auto scrollbar-thin">
                <button id="log-cat-Semua" onclick="Log.switchCategory('Semua', this)"
                    class="px-3 py-1.5 text-xs font-bold rounded-md transition-all whitespace-nowrap bg-neutral-100 text-black">Semua</button>
                <button id="log-cat-sistem" onclick="Log.switchCategory('sistem', this)"
                    class="px-3 py-1.5 text-xs font-bold rounded-md transition-all whitespace-nowrap bg-transparent text-neutral-400 hover:text-neutral-200">Sistem (Legacy)</button>
                <button id="log-cat-transaksi" onclick="Log.switchCategory('transaksi', this)"
                    class="px-3 py-1.5 text-xs font-bold rounded-md transition-all whitespace-nowrap bg-transparent text-neutral-400 hover:text-neutral-200">Transaksi (Legacy)</button>
                <button id="log-cat-sesi" onclick="Log.switchCategory('sesi', this)"
                    class="px-3 py-1.5 text-xs font-bold rounded-md transition-all whitespace-nowrap bg-transparent text-neutral-400 hover:text-neutral-200">Sesi (Legacy)</button>
                <button id="log-cat-blackout" onclick="Log.switchCategory('blackout', this)"
                    class="px-3 py-1.5 text-xs font-bold rounded-md transition-all whitespace-nowrap bg-transparent text-neutral-400 hover:text-neutral-200">Blackout (Legacy)</button>
                
                <!-- New Canonical Category Filters -->
                <button id="log-cat-AUTHENTICATION" onclick="Log.switchCategory('AUTHENTICATION', this)"
                    class="px-3 py-1.5 text-xs font-bold rounded-md transition-all whitespace-nowrap bg-transparent text-neutral-400 hover:text-neutral-200 border border-neutral-800/40">🔐 Autentikasi</button>
                <button id="log-cat-USER_ACCOUNT" onclick="Log.switchCategory('USER_ACCOUNT', this)"
                    class="px-3 py-1.5 text-xs font-bold rounded-md transition-all whitespace-nowrap bg-transparent text-neutral-400 hover:text-neutral-200 border border-neutral-800/40">👥 Akun &amp; User</button>
                <button id="log-cat-AUTHORIZATION_SECURITY" onclick="Log.switchCategory('AUTHORIZATION_SECURITY', this)"
                    class="px-3 py-1.5 text-xs font-bold rounded-md transition-all whitespace-nowrap bg-transparent text-neutral-400 hover:text-neutral-200 border border-neutral-800/40">🛡️ Keamanan</button>
                <button id="log-cat-PAYMENT_BILLING" onclick="Log.switchCategory('PAYMENT_BILLING', this)"
                    class="px-3 py-1.5 text-xs font-bold rounded-md transition-all whitespace-nowrap bg-transparent text-neutral-400 hover:text-neutral-200 border border-neutral-800/40">💳 Pembayaran</button>
                <button id="log-cat-TRANSACTION" onclick="Log.switchCategory('TRANSACTION', this)"
                    class="px-3 py-1.5 text-xs font-bold rounded-md transition-all whitespace-nowrap bg-transparent text-neutral-400 hover:text-neutral-200 border border-neutral-800/40">📊 Transaksi</button>
                <button id="log-cat-SESI_BILLING" onclick="Log.switchCategory('SESI_BILLING', this)"
                    class="px-3 py-1.5 text-xs font-bold rounded-md transition-all whitespace-nowrap bg-transparent text-neutral-400 hover:text-neutral-200 border border-neutral-800/40">⏱️ Sesi Rental</button>
                <button id="log-cat-DATA_CATALOG" onclick="Log.switchCategory('DATA_CATALOG', this)"
                    class="px-3 py-1.5 text-xs font-bold rounded-md transition-all whitespace-nowrap bg-transparent text-neutral-400 hover:text-neutral-200 border border-neutral-800/40">📂 Katalog &amp; PC</button>
                <button id="log-cat-MONITOR_REMOTE" onclick="Log.switchCategory('MONITOR_REMOTE', this)"
                    class="px-3 py-1.5 text-xs font-bold rounded-md transition-all whitespace-nowrap bg-transparent text-neutral-400 hover:text-neutral-200 border border-neutral-800/40">🖥️ Remote</button>
                <button id="log-cat-TOURNAMENT_GAME" onclick="Log.switchCategory('TOURNAMENT_GAME', this)"
                    class="px-3 py-1.5 text-xs font-bold rounded-md transition-all whitespace-nowrap bg-transparent text-neutral-400 hover:text-neutral-200 border border-neutral-800/40">🏆 Turnamen &amp; Game</button>
                <button id="log-cat-CONFIGURATION" onclick="Log.switchCategory('CONFIGURATION', this)"
                    class="px-3 py-1.5 text-xs font-bold rounded-md transition-all whitespace-nowrap bg-transparent text-neutral-400 hover:text-neutral-200 border border-neutral-800/40">⚙️ Konfigurasi</button>
                <button id="log-cat-API_INTEGRATION" onclick="Log.switchCategory('API_INTEGRATION', this)"
                    class="px-3 py-1.5 text-xs font-bold rounded-md transition-all whitespace-nowrap bg-transparent text-neutral-400 hover:text-neutral-200 border border-neutral-800/40">🌐 Router Sync</button>
                <button id="log-cat-BACKGROUND_JOB" onclick="Log.switchCategory('BACKGROUND_JOB', this)"
                    class="px-3 py-1.5 text-xs font-bold rounded-md transition-all whitespace-nowrap bg-transparent text-neutral-400 hover:text-neutral-200 border border-neutral-800/40">🕒 Scheduler</button>
                <button id="log-cat-MAINTENANCE" onclick="Log.switchCategory('MAINTENANCE', this)"
                    class="px-3 py-1.5 text-xs font-bold rounded-md transition-all whitespace-nowrap bg-transparent text-neutral-400 hover:text-neutral-200 border border-neutral-800/40">🔧 Maintenance</button>
                <button id="log-cat-SYSTEM" onclick="Log.switchCategory('SYSTEM', this)"
                    class="px-3 py-1.5 text-xs font-bold rounded-md transition-all whitespace-nowrap bg-transparent text-neutral-400 hover:text-neutral-200 border border-neutral-800/40">⚡ Sistem</button>
                <button id="log-cat-ERROR_FAILURE" onclick="Log.switchCategory('ERROR_FAILURE', this)"
                    class="px-3 py-1.5 text-xs font-bold rounded-md transition-all whitespace-nowrap bg-transparent text-neutral-400 hover:text-neutral-200 border border-neutral-800/40">❌ Error</button>
            </div>
        </div>
        <div class="flex flex-wrap gap-3 mb-4">
            <input type="text" id="filter-log" placeholder="Cari log..."
                class="flex-1 min-w-[150px] px-3 py-2 bg-[#050505] border border-[#1c1c1c] rounded text-xs lg:text-base text-neutral-200 placeholder-neutral-600 focus:outline-none focus:border-neutral-500">
            <button onclick="Log.filter()"
                class="px-4 py-2 bg-neutral-100 hover:bg-neutral-200 text-black text-xs lg:text-base font-bold rounded transition-colors">Cari</button>
            <button onclick="Log.clear()"
                class="px-4 py-2 bg-[#1a0a0c] border border-[#ef4444]/30 hover:bg-red-600 hover:text-white text-red-400 text-xs lg:text-base font-bold rounded transition-colors">Bersihkan</button>
            <button onclick="Log.exportLogs()"
                class="px-4 py-2 bg-[#171717] border border-[#262626] hover:bg-[#222] text-neutral-300 text-xs lg:text-base font-bold rounded transition-colors">Export (.txt)</button>
            <button onclick="Log.exportPDF()"
                class="px-4 py-2 bg-[#2d1215] border border-[#ef4444]/30 hover:bg-[#ef4444] hover:text-white text-red-400 text-xs lg:text-base font-bold rounded transition-colors">Export (.pdf)</button>
        </div>
        <div id="log-content"
            class="bg-[#050505] border border-[#1c1c1c] rounded text-xs lg:text-base max-h-[600px] overflow-auto scrollbar-mono p-4">
            <div class="flex justify-center py-10">
                <div class="w-6 h-6 border-2 border-[#1c1c1c] border-t-neutral-100 rounded-full animate-spin"></div>
            </div>
        </div>
    </div>
</div>
