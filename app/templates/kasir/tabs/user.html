<!-- ===== TAB: USER ===== -->
<div id="tab-user" class="tab-content hidden space-y-6">
    <!-- User Action Header -->
    <div class="bg-[#0c0c0c] border border-[#1c1c1c] rounded p-4 sm:p-6">
        <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
                <h3 class="text-xs lg:max-xl:text-lg xl:text-[22px] font-bold text-neutral-100 uppercase tracking-wider flex items-center gap-2">
                    <span>🔑</span> Manajemen Staff
                </h3>
                <p class="text-[9px] lg:max-xl:text-xs xl:text-base text-neutral-500 mt-1">
                    Kelola akun kasir dan administrator — tambah kasir baru, ganti password, atur role dan benefit
                </p>
            </div>
            <button onclick="User.openAddModal()"
                class="px-3 lg:max-xl:px-3.5 xl:px-4 py-2 lg:max-xl:py-2.5 xl:py-2.5 bg-neutral-100 hover:bg-neutral-200 text-black text-xs lg:max-xl:text-xs xl:text-base font-bold rounded transition-colors flex items-center gap-2">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Tambah User
            </button>
        </div>
    </div>

    <!-- User List -->
    <div class="bg-[#0c0c0c] border border-[#1c1c1c] rounded p-4 sm:p-6">
        <h3 class="text-xs lg:max-xl:text-lg xl:text-[22px] font-bold text-neutral-200 uppercase tracking-wider mb-4">Daftar Akun</h3>
        <div id="user-table" class="overflow-x-auto w-full">
            <div class="flex justify-center py-10">
                <div class="w-6 h-6 border-2 border-[#2a2a2a] border-t-neutral-100 rounded-full animate-spin"></div>
            </div>
        </div>
    </div>
</div>
