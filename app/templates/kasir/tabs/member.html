<!-- ===== TAB: MEMBER ===== -->
<div id="tab-member" class="tab-content hidden space-y-2 sm:space-y-2.5">
    <div class="bg-[#0c0c0c] border border-[#1c1c1c] rounded p-2.5 sm:p-3 xl:p-3.5 space-y-2.5">
        <!-- 1. Header Toolbar Terpadu -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-2 border-b border-[#1c1c1c]">
            <div>
                <h3 class="text-xs sm:text-sm font-bold text-neutral-100 uppercase tracking-wider">Member</h3>
                <p class="text-[10px] sm:text-xs text-neutral-500">Kelola akun member: daftarkan, isi saldo, dan pantau status waktu</p>
            </div>
            <div class="flex items-center gap-2">
                <div class="relative flex-1 sm:w-48 xl:w-56">
                    <label for="member-search-input" class="sr-only">Cari Member</label>
                    <input type="text" id="member-search-input" placeholder="Cari username..."
                        class="w-full pl-7 pr-6 py-1.5 bg-[#050505] border border-[#1c1c1c] rounded text-[11px] sm:text-xs text-neutral-200 placeholder:text-neutral-600 focus:outline-none focus:border-neutral-500 font-medium"
                        oninput="Member.debouncedSearch()"
                        onkeypress="if(event.key === 'Enter') Member.doSearch()">
                    <span class="absolute left-2 top-1/2 -translate-y-1/2 text-neutral-500 pointer-events-none">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </span>
                    <button id="member-search-clear" onclick="Member.clearSearch()" class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-neutral-500 hover:text-neutral-300 text-[10px] font-bold">✕</button>
                </div>
                <button onclick="Member.showAddModal()"
                    class="remote-hide-action px-2.5 sm:px-3 py-1.5 bg-neutral-100 hover:bg-white text-black text-xs font-bold rounded transition-colors flex items-center gap-1.5 shadow-sm shrink-0">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    <span class="hidden sm:inline">Tambah Member</span>
                    <span class="sm:hidden">Tambah</span>
                </button>
            </div>
        </div>

        <!-- 2. Baris Tab Pills Grup Horizontal -->
        <div id="member-group-tabs" class="flex items-center gap-1.5 overflow-x-auto scrollbar-none py-0.5">
            <div class="h-7 w-20 bg-[#161616] rounded animate-pulse"></div>
            <div class="h-7 w-16 bg-[#161616] rounded animate-pulse"></div>
        </div>

        <!-- 3. Kontainer Tabel Member & Pagination -->
        <div id="member-table" class="w-full">
            <div class="overflow-x-auto w-full border border-[#1c1c1c] rounded">
                <table class="w-full text-xs">
                    <thead>
                        <tr class="text-[10px] sm:text-xs text-neutral-400 uppercase border-b border-[#1c1c1c] bg-[#0c0c0c] tracking-wider select-none">
                            <th class="px-2.5 sm:px-3 py-2 text-left font-medium">Member</th>
                            <th class="hidden sm:table-cell px-2.5 sm:px-3 py-2 text-center font-medium">Grup</th>
                            <th class="px-2.5 sm:px-3 py-2 text-center font-medium">Waktu</th>
                            <th class="hidden md:table-cell px-2.5 sm:px-3 py-2 text-center font-medium">Berlaku Sampai</th>
                            <th class="hidden sm:table-cell px-2.5 sm:px-3 py-2 text-center font-medium">Status</th>
                            <th class="px-2.5 sm:px-3 py-2 text-right font-medium">Aksi</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-[#1c1c1c]">
                        {% for _ in range(8) %}
                        <tr class="animate-pulse">
                            <td class="px-2.5 sm:px-3 py-2 text-left">
                                <div class="flex items-center gap-2">
                                    <div class="w-7 h-7 sm:w-8 sm:h-8 rounded bg-[#1c1c1c] shrink-0"></div>
                                    <div class="space-y-1">
                                        <div class="h-3 bg-[#262626] rounded w-20"></div>
                                        <div class="h-2 bg-[#1a1a1a] rounded w-14"></div>
                                    </div>
                                </div>
                            </td>
                            <td class="hidden sm:table-cell px-2.5 sm:px-3 py-2 text-center">
                                <div class="h-4 bg-[#202020] rounded w-14 mx-auto"></div>
                            </td>
                            <td class="px-2.5 sm:px-3 py-2 text-center">
                                <div class="h-3 bg-[#262626] rounded w-14 mx-auto"></div>
                            </td>
                            <td class="hidden md:table-cell px-2.5 sm:px-3 py-2 text-center">
                                <div class="h-3 bg-[#1e1e1e] rounded w-20 mx-auto"></div>
                            </td>
                            <td class="hidden sm:table-cell px-2.5 sm:px-3 py-2 text-center">
                                <div class="h-4 bg-[#202020] rounded-full w-12 mx-auto"></div>
                            </td>
                            <td class="px-2.5 sm:px-3 py-2 text-right">
                                <div class="flex items-center justify-end gap-1">
                                    <div class="h-6 w-6 bg-[#202020] rounded"></div>
                                    <div class="h-6 w-6 bg-[#202020] rounded"></div>
                                </div>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
