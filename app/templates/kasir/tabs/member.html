<!-- ===== TAB: MEMBER ===== -->
<div id="tab-member" class="tab-content hidden space-y-6">
    <!-- Member Action Header -->
    <div class="bg-[#111] border border-[#1f1f1f] rounded-xl p-5">
        <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
                <h3 class="text-sm lg:max-xl:text-lg xl:text-[22px] font-bold text-neutral-100 tracking-wide">Member</h3>
                <p class="text-[10px] lg:max-xl:text-xs xl:text-base text-neutral-500 mt-0.5">Kelola akun member: daftarkan, isi saldo, lihat riwayat transaksi</p>
            </div>
            <button onclick="Member.showAddModal()"
                class="remote-hide-action px-4 py-2.5 bg-neutral-100 hover:bg-white text-black text-xs lg:max-xl:text-xs xl:text-base font-bold rounded-lg transition-colors flex items-center gap-2">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Tambah Member
            </button>
        </div>
    </div>

    <div class="bg-[#111] border border-[#1f1f1f] rounded-xl p-5">
        <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
            <h3 class="text-xs lg:max-xl:text-lg xl:text-[22px] font-bold text-neutral-400 uppercase tracking-wider">Daftar Member</h3>
            <div class="flex flex-wrap items-center gap-2">
                <input type="text" id="member-search-input" placeholder="Cari username..."
                    class="px-3 py-2 bg-[#0a0a0a] border border-[#2a2a2a] rounded-lg text-xs lg:max-xl:text-xs xl:text-base text-neutral-200 placeholder-neutral-600 focus:outline-none focus:border-neutral-500 w-40"
                    oninput="Member.debouncedSearch()"
                    onkeypress="if(event.key === 'Enter') Member.doSearch()">
                <select id="member-grup-filter-select"
                    class="px-3 py-2 bg-[#0a0a0a] border border-[#2a2a2a] rounded-lg text-xs lg:max-xl:text-xs xl:text-base text-neutral-200 focus:outline-none focus:border-neutral-500"
                    onchange="Member.doSearch()">
                    <option value="">Semua Grup</option>
                </select>
                <button onclick="Member.doSearch()"
                    class="px-4 py-2 bg-neutral-100 hover:bg-white text-black text-xs lg:max-xl:text-xs xl:text-base font-bold rounded-lg transition-colors">Cari</button>
                <button onclick="Member.clearSearch()"
                    class="px-4 py-2 bg-[#1a1a1a] border border-[#2a2a2a] hover:bg-[#222] text-neutral-300 text-xs lg:max-xl:text-xs xl:text-base font-bold rounded-lg transition-colors">Reset</button>
            </div>
        </div>
        <div id="member-table" class="overflow-x-auto w-full">
            <table class="w-full text-xs lg:max-xl:text-xs xl:text-base block lg:table">
                <thead class="hidden lg:table-header-group">
                    <tr class="border-b border-[#262626] text-neutral-400">
                        <th class="px-4 py-3 text-left font-medium w-1/4">Member</th>
                        <th class="px-4 py-3 text-left font-medium">Grup</th>
                        <th class="px-4 py-3 text-left font-medium">Sisa Waktu</th>
                        <th class="px-4 py-3 text-left font-medium">Berlaku Sampai</th>
                        <th class="px-4 py-3 text-left font-medium">Status</th>
                        <th class="px-4 py-3 text-right font-medium w-36">Aksi</th>
                    </tr>
                </thead>
                <tbody class="block lg:table-row-group divide-y divide-[#1c1c1c]">
                    {% for _ in range(6) %}
                    <tr class="border-b border-[#1c1c1c] animate-pulse flex flex-col lg:table-row p-3 lg:p-0">
                        <td class="px-4 py-3 text-left">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded bg-[#1c1c1c] flex-shrink-0"></div>
                                <div class="space-y-1 flex-1">
                                    <div class="h-3.5 bg-[#262626] rounded w-24"></div>
                                    <div class="h-2.5 bg-[#1a1a1a] rounded w-32"></div>
                                </div>
                            </div>
                        </td>
                        <td class="px-4 py-3 text-left">
                            <div class="h-5 bg-[#202020] rounded w-16"></div>
                        </td>
                        <td class="px-4 py-3 text-left">
                            <div class="h-3.5 bg-[#262626] rounded w-20"></div>
                        </td>
                        <td class="px-4 py-3 text-left">
                            <div class="h-3 bg-[#1e1e1e] rounded w-28"></div>
                        </td>
                        <td class="px-4 py-3 text-left">
                            <div class="h-5 bg-[#202020] rounded-full w-14"></div>
                        </td>
                        <td class="px-4 py-3 text-right">
                            <div class="flex items-center justify-end gap-1.5">
                                <div class="h-7 w-7 bg-[#202020] rounded"></div>
                                <div class="h-7 w-7 bg-[#202020] rounded"></div>
                                <div class="h-7 w-7 bg-[#202020] rounded"></div>
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
