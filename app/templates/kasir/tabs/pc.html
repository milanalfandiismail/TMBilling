<!-- ===== TAB: PC ===== -->
<div id="tab-pc" class="tab-content hidden space-y-2 sm:space-y-2.5">
    <div class="bg-[#0c0c0c] border border-[#1c1c1c] rounded p-2.5 sm:p-3 xl:p-3.5 2xl:p-5 space-y-2.5 2xl:space-y-4">
        <!-- 1. Header Toolbar Terpadu -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-2 2xl:pb-3 border-b border-[#1c1c1c]">
            <div>
                <h3 class="text-xs sm:text-sm 2xl:text-base font-bold text-neutral-100 uppercase tracking-wider">Unit PC</h3>
                <p class="text-[10px] sm:text-xs 2xl:text-sm text-neutral-500">Kelola stasiun warnet: status, grup, IP address, dan mode unit</p>
            </div>
            <div class="flex items-center gap-2">
                <div class="relative flex-1 sm:w-48 2xl:w-64">
                    <label for="pc-search-input" class="sr-only">Cari PC</label>
                    <input type="text" id="pc-search-input" placeholder="Cari PC / IP / MAC..."
                        class="w-full pl-7 2xl:pl-8 pr-6 2xl:pr-7 py-1.5 2xl:py-2 bg-[#050505] border border-[#1c1c1c] rounded text-[11px] sm:text-xs 2xl:text-sm text-neutral-200 placeholder:text-neutral-600 focus:outline-none focus:border-neutral-500 font-medium"
                        oninput="PC.debouncedSearch()"
                        onkeypress="if(event.key === 'Enter') PC.doSearch()">
                    <span class="absolute left-2 2xl:left-2.5 top-1/2 -translate-y-1/2 text-neutral-500 pointer-events-none">
                        <svg class="w-3 h-3 2xl:w-3.5 2xl:h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </span>
                    <button id="pc-search-clear" onclick="PC.clearSearch()" class="hidden absolute right-2 2xl:right-2.5 top-1/2 -translate-y-1/2 text-neutral-500 hover:text-neutral-300 text-[10px] 2xl:text-xs font-bold">✕</button>
                </div>
                {% if session.get('kasir_role') == 'admin' %}
                <div class="flex items-center gap-1.5 2xl:gap-2 shrink-0 remote-hide-action">
                    <button onclick="PC.showAddModal()"
                        class="px-2.5 sm:px-3 2xl:px-4 py-1.5 2xl:py-2 bg-neutral-100 hover:bg-white text-black text-xs 2xl:text-sm font-bold rounded transition-colors flex items-center gap-1.5 shadow-sm">
                        <svg class="w-3.5 h-3.5 2xl:w-4 2xl:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        <span class="hidden sm:inline">Tambah PC</span>
                        <span class="sm:hidden">Tambah</span>
                    </button>
                    <button onclick="PC.showAddBatchModal()"
                        class="px-2.5 sm:px-3 2xl:px-3.5 py-1.5 2xl:py-2 bg-[#161616] border border-[#262626] hover:bg-[#202020] text-neutral-300 text-xs 2xl:text-sm font-bold rounded transition-colors flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5 2xl:w-4 2xl:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14v6m-3-3h6M6 10h2a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v2a2 2 0 002 2zm10 0h2a2 2 0 002-2V6a2 2 0 00-2-2h-2a2 2 0 00-2 2v2a2 2 0 002 2zM6 20h2a2 2 0 002-2v-2a2 2 0 00-2-2H6a2 2 0 00-2 2v2a2 2 0 002 2z"></path></svg>
                        <span class="hidden md:inline">Batch Import</span>
                        <span class="md:hidden">Batch</span>
                    </button>
                </div>
                {% endif %}
            </div>
        </div>

        <!-- 2. Baris Tab Pills Grup Horizontal -->
        <div id="pc-group-tabs" class="flex items-center gap-1.5 2xl:gap-2.5 overflow-x-auto scrollbar-none py-0.5 2xl:py-1">
            <div class="h-7 2xl:h-9 w-20 2xl:w-24 bg-[#161616] rounded animate-pulse"></div>
            <div class="h-7 2xl:h-9 w-16 2xl:w-20 bg-[#161616] rounded animate-pulse"></div>
        </div>

        <!-- 3. Kontainer Grid PC & Pagination -->
        <div id="pc-table" class="w-full">
            <div class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-6 gap-2 sm:gap-2.5 2xl:gap-3">
                {% for _ in range(8) %}
                <div class="bg-[#0c0c0c] border border-[#262626] rounded p-2.5 sm:p-3 2xl:p-3.5 relative flex flex-col justify-between min-h-[82px] sm:min-h-[88px] 2xl:min-h-[98px] animate-pulse">
                    <div class="flex items-center justify-between gap-1.5">
                        <div class="flex items-center gap-1.5 flex-1">
                            <div class="w-3.5 h-3.5 bg-[#262626] rounded shrink-0"></div>
                            <div class="h-3.5 2xl:h-4 bg-[#262626] rounded w-16 sm:w-20"></div>
                        </div>
                        <div class="w-2 h-2 2xl:w-2.5 2xl:h-2.5 rounded-full bg-[#262626] shrink-0"></div>
                    </div>
                    <div class="flex items-center justify-between gap-1.5 my-1">
                        <div class="h-2.5 2xl:h-3 bg-[#1e1e1e] rounded w-20"></div>
                        <div class="flex xl:hidden items-center gap-1">
                            <div class="w-4 h-4 rounded bg-[#1a1a1a]"></div>
                            <div class="w-4 h-4 rounded bg-[#1a1a1a]"></div>
                        </div>
                    </div>
                    <div class="flex items-center justify-start mt-auto">
                        <div class="h-3.5 2xl:h-4 bg-[#202020] rounded w-16"></div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
