<!DOCTYPE html>
<html lang="id" class="min-h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMBilling - TV Signage (Dashboard Mode)</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}?v=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .mono {
            font-family: 'JetBrains+Mono', monospace;
        }
        #tv-static-container {
            width: 100%;
            box-sizing: border-box;
        }
        /* Custom neon glowing effects for cards */
        .glow-green {
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.05);
        }
        .glow-yellow {
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.05);
        }
    </style>
</head>
<body class="select-none bg-[#050505] text-[#f5f5f5] min-h-screen flex flex-col p-4 overflow-y-auto lg:overflow-hidden hide-scrollbar">

    <!-- Main Container -->
    <div id="tv-static-container" class="w-full flex-1 flex flex-col justify-between p-6 gap-6">
        
        <!-- HEADER SECTION -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-neutral-900 pb-5 gap-3 shrink-0">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-neutral-100 flex items-center justify-center">
                    <span class="text-[#050505] font-black text-xl" id="warnet-logo">TM</span>
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-tight text-neutral-100" id="warnet-title">TMBilling</h1>
                </div>
            </div>
            
            <!-- Live Stats & Clock -->
            <div class="flex items-center gap-6 md:gap-8 w-full md:w-auto justify-between md:justify-end mt-3 md:mt-0">
                <div class="flex gap-4 md:gap-6 border-r border-neutral-900 pr-4 md:pr-8">
                    <div class="text-right">
                        <p class="text-[10px] text-neutral-500 uppercase font-bold tracking-wider">PC Tersedia</p>
                        <p class="text-xl font-extrabold text-neutral-200" id="stat-occupancy">- / -</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] text-neutral-500 uppercase font-bold tracking-wider">Utilisasi</p>
                        <p class="text-xl font-extrabold text-neutral-200" id="stat-utilization">-%</p>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-[10px] text-neutral-500 uppercase font-bold tracking-wider" id="current-date">SABTU, 4 AGUSTUS 2026</p>
                    <p class="text-2xl md:text-3xl font-black text-neutral-100 tracking-tight mono" id="current-clock">00:00:00</p>
                </div>
            </div>
        </header>

        <!-- MAIN GRID DASHBOARD -->
        <main class="flex-1 flex flex-col gap-4 overflow-hidden min-h-0 relative">
            
            <!-- ROW 1: STATUS KOMPUTER PER GRUP -->
            <section class="shrink-0 flex flex-col min-h-0">
                <div class="flex items-center gap-2 mb-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <h2 class="text-sm sm:text-base font-black text-neutral-300 uppercase tracking-wider">Status Komputer</h2>
                </div>
                <div id="pc-groups-row" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 items-stretch animate-fade-in">
                    <!-- Group PC columns injected dynamically here -->
                </div>
            </section>

            <!-- ROW 2: DAFTAR PAKET BILLING PER GRUP -->
            <section class="shrink-0 flex flex-col min-h-0">
                <div class="flex items-center gap-2 mb-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
                    <h2 class="text-sm sm:text-base font-black text-neutral-300 uppercase tracking-wider">Daftar Paket</h2>
                </div>
                <div id="promo-groups-row" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 items-stretch animate-fade-in">
                    <!-- Group Paket columns injected dynamically here -->
                </div>
            </section>

            <!-- ROW 3: KANTIN & ATURAN -->
            <section class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4 min-h-0">
                
                <!-- PANEL 1: KANTIN (MENU MAKANAN) -->
                <div class="bg-neutral-950/40 border border-neutral-900 rounded-2xl p-3 flex flex-col min-h-0 overflow-hidden">
                    <h3 class="text-xs sm:text-sm font-black text-neutral-300 uppercase tracking-wider mb-2 flex items-center gap-2 border-b border-neutral-900 pb-2 shrink-0">
                        🍔 Kantin & F&B Menu
                    </h3>
                    <div class="flex-1 overflow-y-auto hide-scrollbar space-y-2 animate-fade-in" id="kantin-menu-list">
                        <!-- Food items injected dynamically -->
                    </div>
                </div>

                <!-- PANEL 2: PERATURAN & ATURAN -->
                <div class="bg-neutral-950/40 border border-neutral-900 rounded-2xl p-3 flex flex-col min-h-0 overflow-hidden">
                    <h3 class="text-xs sm:text-sm font-black text-neutral-300 uppercase tracking-wider mb-2 flex items-center gap-2 border-b border-neutral-900 pb-2 shrink-0">
                        📢 Aturan & Informasi
                    </h3>
                    <ul class="flex-1 overflow-y-auto hide-scrollbar space-y-2 text-neutral-400 text-xs sm:text-sm leading-relaxed animate-fade-in" id="rules-list">
                        <!-- Rules injected dynamically -->
                    </ul>
                </div>

            </section>

        </main>
        
    </div>

    <!-- SCRIPTS -->
    <script src="{{ url_for('static', filename='js/public/tv_static.js') }}?v=1"></script>
</body>
</html>
