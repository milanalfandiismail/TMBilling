<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMBilling - TV Signage (Dashboard Mode)</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #f5f5f5;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        .mono {
            font-family: 'JetBrains+Mono', monospace;
        }
        /* Glowing neon indicators */
        .glow-green {
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.15);
        }
        .glow-rose {
            box-shadow: 0 0 12px rgba(244, 63, 94, 0.18);
        }
        .glow-blue {
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.15);
        }
        .glow-yellow {
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.15);
        }
        /* Running text marquee animation */
        @keyframes tv-marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .tv-marquee-track {
            display: inline-block;
            white-space: nowrap;
            will-change: transform;
            animation: tv-marquee 35s linear infinite;
        }
        .tv-marquee-track:hover {
            animation-play-state: paused;
        }
        /* Custom scrollbar remover */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-[#050505] text-[#f5f5f5] flex flex-col p-3 sm:p-4 md:p-5 box-border">

    <!-- 1. HEADER SECTION -->
    <header class="flex justify-between items-center border-b border-neutral-900/80 pb-3 md:pb-4 shrink-0 gap-3 min-w-0">
        <!-- Brand & Title -->
        <div class="flex items-center gap-2.5 md:gap-3.5 min-w-0">
            <div class="w-10 h-10 md:w-12 md:h-12 rounded-2xl bg-neutral-100 flex items-center justify-center shadow-lg shrink-0">
                <span class="text-[#050505] font-black text-base md:text-xl tracking-tighter" id="warnet-logo">TM</span>
            </div>
            <div class="min-w-0">
                <div class="flex items-center gap-2">
                    <h1 class="text-lg md:text-2xl font-black tracking-tight text-neutral-100 uppercase truncate" id="warnet-title">TMBilling</h1>
                    <span class="hidden sm:inline-flex px-2 py-0.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-[10px] font-black tracking-widest uppercase shrink-0">LIVE TV</span>
                </div>
                <p class="hidden sm:block text-[11px] text-neutral-500 font-semibold tracking-wide">STATUS DASHBOARD & PRICING</p>
            </div>
        </div>
        
        <!-- Live Stats & Clock -->
        <div class="flex items-center gap-3 md:gap-7 shrink-0">
            <!-- Occupancy Stats: hidden on small screens to prevent header overflow -->
            <div class="hidden lg:flex items-center gap-5 border-r border-neutral-900/80 pr-5 md:pr-7">
                <div class="text-right">
                    <p class="text-[10px] text-neutral-500 uppercase font-bold tracking-wider">PC Tersedia</p>
                    <p class="text-lg md:text-xl font-black text-emerald-400 font-mono" id="stat-occupancy">- / -</p>
                </div>
                <div class="text-right">
                    <p class="text-[10px] text-neutral-500 uppercase font-bold tracking-wider">Utilisasi</p>
                    <p class="text-lg md:text-xl font-black text-neutral-200 font-mono" id="stat-utilization">-%</p>
                </div>
            </div>
            <!-- Compact stat for <=lg -->
            <div class="flex lg:hidden items-center gap-2 border-r border-neutral-900/80 pr-3">
                <div class="text-right">
                    <p class="text-[9px] text-neutral-500 uppercase font-bold tracking-wider">Tersedia</p>
                    <p class="text-sm font-black text-emerald-400 font-mono" id="stat-occupancy-sm">- / -</p>
                </div>
            </div>
            
            <!-- Realtime Clock -->
            <div class="text-right">
                <p class="hidden sm:block text-[10px] text-neutral-500 uppercase font-bold tracking-wider" id="current-date">SABTU, 5 SEPTEMBER 2026</p>
                <p class="text-xl md:text-3xl font-black text-neutral-100 tracking-tight mono" id="current-clock">00:00:00</p>
            </div>
        </div>
    </header>

    <!-- 2. MAIN 2-COLUMN DISPLAY (NO SCROLL, NO SCALE DISTORTION) -->
    <main class="flex-1 flex flex-col lg:flex-row gap-3 md:gap-4 min-h-0 overflow-hidden my-3">
        
        <!-- KOLOM KIRI: STATUS KOMPUTER / LIVE PC MAP (Lebar ~66%) -->
        <section id="tv-pc-section" class="w-full lg:w-[66%] xl:w-[68%] flex flex-col bg-[#0a0a0a] border border-neutral-900/80 rounded-2xl p-3.5 md:p-4 min-h-0 overflow-hidden shadow-2xl">
            <!-- PC Header & Legend -->
            <div class="flex flex-wrap items-center justify-between border-b border-neutral-900/80 pb-2 mb-2.5 shrink-0 gap-x-2 gap-y-1.5">
                <!-- Left: title + badges -->
                <div class="flex items-center gap-2 min-w-0">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse shrink-0"></span>
                    <h2 class="text-xs md:text-sm font-black text-neutral-200 uppercase tracking-wider whitespace-nowrap" id="pc-header-title">Status Komputer</h2>
                    <span id="total-pc-badge" class="px-2 py-0.5 rounded-md bg-neutral-900 border border-neutral-800 text-[10px] font-mono font-bold text-neutral-400 shrink-0 whitespace-nowrap">0 PC</span>
                    <span id="pc-page-badge" class="hidden px-2 py-0.5 rounded-md bg-blue-500/10 border border-blue-500/20 text-[10px] font-mono font-bold text-blue-400 animate-pulse shrink-0 whitespace-nowrap">Hal 1/1</span>
                </div>
                
                <!-- Status Legend Pills (100% Konsisten dengan /public livepc) -->
                <div class="flex items-center gap-1 sm:gap-1.5 text-[9px] sm:text-[10px] font-bold shrink-0">
                    <span class="flex items-center gap-1 px-1.5 py-0.5 rounded bg-emerald-950/40 border border-emerald-800/40 text-emerald-400 whitespace-nowrap">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Kosong
                    </span>
                    <span class="flex items-center gap-1 px-1.5 py-0.5 rounded bg-rose-950/40 border border-rose-800/40 text-rose-400 whitespace-nowrap">
                        <span class="w-1.5 h-1.5 rounded-full bg-rose-400"></span> Terpakai
                    </span>
                    <span class="flex items-center gap-1 px-1.5 py-0.5 rounded bg-amber-950/40 border border-amber-800/40 text-amber-400 whitespace-nowrap">
                        <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span> Admin
                    </span>
                    <span class="flex items-center gap-1 px-1.5 py-0.5 rounded bg-neutral-900/60 border border-neutral-800 text-neutral-500 whitespace-nowrap">
                        <span class="w-1.5 h-1.5 rounded-full bg-neutral-600"></span> Offline
                    </span>
                </div>
            </div>

            <!-- Dynamic PC Zones Container dengan Transisi Halus -->
            <div id="pc-groups-row" class="flex-1 flex flex-col gap-3.5 min-h-0 overflow-hidden no-scrollbar transition-opacity duration-300">
                <!-- Group PC columns injected dynamically here -->
            </div>
        </section>

        <!-- KOLOM KANAN: PAKET & KANTIN (Lebar ~34%) -->
        <section id="tv-sidebar-section" class="w-full lg:w-[34%] xl:w-[32%] flex flex-col gap-3 md:gap-3.5 min-h-0 overflow-hidden">
            
            <!-- PANEL 1: DAFTAR PAKET BILLING -->
            <div class="flex-1 bg-[#0a0a0a] border border-neutral-900/80 rounded-2xl p-3 md:p-3.5 flex flex-col min-h-0 overflow-hidden shadow-2xl">
                <div class="flex items-center justify-between border-b border-neutral-900/80 pb-1.5 mb-2 shrink-0 gap-2">
                    <div class="flex items-center gap-2 min-w-0">
                        <span class="w-2.5 h-2.5 rounded-full bg-blue-500 shrink-0"></span>
                        <h3 class="text-xs md:text-sm font-black text-neutral-200 uppercase tracking-wider whitespace-nowrap" id="promo-header-title">Daftar Paket</h3>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                        <span id="promo-count-badge" class="px-2 py-0.5 rounded-md bg-neutral-900 border border-neutral-800 text-[10px] font-mono font-bold text-neutral-400 whitespace-nowrap">0 Paket</span>
                        <span id="promo-page-badge" class="hidden px-2 py-0.5 rounded-md bg-blue-500/10 border border-blue-500/20 text-[10px] font-mono font-bold text-blue-400 animate-pulse whitespace-nowrap">Hal 1/1</span>
                    </div>
                </div>
                
                <div id="promo-groups-row" class="flex-1 min-h-0 flex flex-col overflow-hidden no-scrollbar transition-opacity duration-300">
                    <!-- Paket items injected dynamically -->
                </div>
            </div>

            <!-- PANEL 2: KANTIN & F&B MENU -->
            <div class="flex-1 bg-[#0a0a0a] border border-neutral-900/80 rounded-2xl p-3 md:p-3.5 flex flex-col min-h-0 overflow-hidden shadow-2xl">
                <div class="flex items-center justify-between border-b border-neutral-900/80 pb-1.5 mb-2 shrink-0 gap-2">
                    <div class="flex items-center gap-2 min-w-0">
                        <span class="w-2.5 h-2.5 rounded-full bg-amber-500 shrink-0"></span>
                        <h3 class="text-xs md:text-sm font-black text-neutral-200 uppercase tracking-wider whitespace-nowrap" id="kantin-header-title">Kantin & F&B</h3>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                        <span id="kantin-count-badge" class="px-2 py-0.5 rounded-md bg-neutral-900 border border-neutral-800 text-[10px] font-mono font-bold text-neutral-400 whitespace-nowrap">Menu</span>
                        <span id="kantin-page-badge" class="hidden px-2 py-0.5 rounded-md bg-amber-500/10 border border-amber-500/20 text-[10px] font-mono font-bold text-amber-400 animate-pulse whitespace-nowrap">Hal 1/1</span>
                    </div>
                </div>
                
                <div id="kantin-menu-list" class="flex-1 min-h-0 flex flex-col overflow-hidden no-scrollbar transition-opacity duration-300">
                    <!-- Food items injected dynamically -->
                </div>
            </div>

        </section>

    </main>

    <!-- 3. FOOTER RUNNING TEXT TICKER (PENGUMUMAN) -->
    <footer class="h-9 bg-[#0a0a0a] border border-neutral-900/80 rounded-xl px-3 flex items-center gap-3 shrink-0 overflow-hidden">
        <div class="flex items-center gap-1.5 px-2 py-0.5 rounded bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 font-black text-[10px] uppercase tracking-wider shrink-0">
            <svg class="w-3 h-3 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/>
            </svg>
            <span>INFO</span>
        </div>
        
        <div class="overflow-hidden whitespace-nowrap flex-1 relative">
            <div id="tv-running-text" class="tv-marquee-track text-xs font-semibold text-neutral-300">
                Memuat pengumuman warnet...
            </div>
        </div>
    </footer>

    <!-- SCRIPTS -->
    <script src="{{ url_for('static', filename='js/public/tv_static.js') }}?v=6"></script>
</body>
</html>
