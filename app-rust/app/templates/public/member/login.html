<!DOCTYPE html>
<html lang="id">

<head>
    {% set page_title = "Login Member | " ~ warnet_title %}
    {% include 'public/components/_head.html' %}
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <style>
        input[type="text"],
        input[type="password"] {
            background-color: #050505 !important;
            border-color: #262626 !important;
            color: #e5e5e5 !important;
            border-width: 1px !important;
            border-style: solid !important;
            border-radius: 6px !important;
            transition: border-color 0.15s ease-in-out !important;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #737373 !important;
            outline: none !important;
        }
    </style>
</head>

<body class="bg-[#050505] text-neutral-200 min-h-screen flex items-center justify-center p-4 antialiased">
    <div class="w-full max-w-sm">

        <!-- Brand Header -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center h-10 sm:h-11 w-auto max-w-[120px] mb-3 select-none">
                <img src="{{ url_for('static', filename='img/logo.png') }}?v={{ v_cache }}" alt="TM Logo" class="h-full w-auto object-contain">
            </div>
            <h1 class="text-lg sm:text-xl font-extrabold text-neutral-100 tracking-tight">{{ warnet_title }}</h1>
            <p class="text-neutral-500 text-[10px] mt-1 font-mono uppercase tracking-widest">Portal Member</p>
        </div>

        <!-- Card Container -->
        <div class="bg-[#0c0c0c] border border-[#1c1c1c] rounded p-5 sm:p-6 space-y-5">
            <div class="border-b border-[#1c1c1c] pb-3">
                <h2 class="text-xs font-bold text-neutral-200 uppercase tracking-wider">Masuk Akun Member</h2>
                <p class="text-[11px] text-neutral-500 mt-0.5">Pantau sisa waktu, riwayat sesi, dan transaksi Anda.</p>
            </div>

            <!-- Error Box -->
            <div id="error-box"
                class="hidden p-3 bg-red-950/20 border border-red-800/30 rounded flex items-start gap-2">
                <svg class="w-4 h-4 text-red-400 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span id="error-text" class="text-xs text-red-400 leading-tight"></span>
            </div>

            <!-- Toast Container -->
            <div id="toast-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: none;"></div>

            <!-- Login Form -->
            <form onsubmit="submitLogin(event)" class="space-y-4">
                <div class="space-y-1.5">
                    <label for="username" class="block text-[11px] font-bold text-neutral-400 uppercase tracking-wider">Username Member</label>
                    <input type="text" id="username" placeholder="Masukkan username member" required autofocus
                        class="w-full px-3 py-2.5 text-sm font-mono focus:outline-none">
                </div>

                <div class="space-y-1.5">
                    <label for="password" class="block text-[11px] font-bold text-neutral-400 uppercase tracking-wider">Password</label>
                    <input type="password" id="password" placeholder="Masukkan password" required
                        class="w-full px-3 py-2.5 text-sm focus:outline-none">
                </div>

                <button type="submit" id="btn-login"
                    class="w-full py-2.5 bg-neutral-100 hover:bg-white text-black rounded font-bold text-xs uppercase tracking-wider transition-colors flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    <span id="btn-text">Masuk</span>
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                            d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                    </svg>
                </button>
            </form>
        </div>

        <div class="text-center mt-5">
            <a href="/"
                class="inline-flex items-center gap-1.5 text-xs text-neutral-500 hover:text-neutral-200 font-mono transition-colors">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Kembali ke Beranda
            </a>
        </div>

        <div class="text-center text-neutral-600 text-[11px] mt-6 font-mono">
            <div>{{ warnet_title }} - Portal Member</div>
            <div class="mt-0.5">TMBilling {{ version }} &copy; 2026</div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/member/toast.js') }}?v={{ v_cache }}"></script>
    <script>
        async function submitLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const btnText = document.getElementById('btn-text');
            const errBox = document.getElementById('error-box');
            const errText = document.getElementById('error-text');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

            errBox.classList.add('hidden');

            if (!username || !password) {
                Toast.error('Username dan password wajib diisi.');
                return;
            }

            btn.disabled = true;
            btnText.innerText = 'Memverifikasi...';

            try {
                const res = await fetch('/member/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    Toast.success('Login berhasil, mengalihkan...');
                    setTimeout(() => { window.location.href = data.redirect; }, 600);
                } else {
                    const msg = data.error || 'Username atau password salah';
                    errText.textContent = msg;
                    errBox.classList.remove('hidden');
                    Toast.error(msg);
                    btn.disabled = false;
                    btnText.innerText = 'Masuk';
                }
            } catch (err) {
                Toast.error('Gagal terhubung ke server');
                btn.disabled = false;
                btnText.innerText = 'Masuk';
            }
        }
    </script>
</body>

</html>
