<!--
  _navbar_member.html — Navbar untuk dashboard portal member
  Variabel yang dibutuhkan:
    - warnet_title : string — Nama warnet
    - member       : object — Member yang sedang login (member.username)
-->

<header class="w-full bg-[#0a0a0a] border-b border-[#1c1c1c] shrink-0 sticky top-0 z-30">
    <div class="max-w-7xl 2xl:max-w-[1536px] mx-auto h-14 sm:h-16 px-3 sm:px-6 lg:px-8 flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5 min-w-0">
            <a href="/member/dashboard" class="flex items-center gap-2.5 min-w-0">
                <div class="h-7 sm:h-8 w-auto max-w-[44px] flex items-center justify-center shrink-0 select-none">
                    <img src="{{ url_for('static', filename='img/logo.png') }}?v={{ v_cache }}" alt="TM Logo" class="h-full w-auto object-contain">
                </div>
                <div class="min-w-0">
                    <h1 class="text-xs sm:text-sm font-extrabold text-neutral-100 leading-tight break-words">{{ warnet_title }}</h1>
                    <p class="text-[9px] sm:text-[10px] text-neutral-500 font-mono tracking-wider uppercase mt-1">Portal Member</p>
                </div>
            </a>
        </div>

        <div class="flex items-center gap-2 shrink-0">
            <div class="hidden sm:flex items-center gap-2 px-2.5 py-1 bg-[#111] border border-[#222] rounded mr-1">
                <span class="w-1.5 h-1.5 rounded-full {{ 'bg-emerald-500' if member.aktif else 'bg-red-500' }}"></span>
                <span class="text-xs font-mono font-bold text-neutral-200">{{ member.username }}</span>
            </div>
            <a href="/"
                class="px-2.5 sm:px-3 py-1.5 bg-[#121212] border border-[#262626] hover:border-neutral-500 text-neutral-300 hover:text-neutral-100 text-xs font-bold rounded transition-colors flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                </svg>
                <span class="hidden sm:inline">Beranda</span>
            </a>
            <button type="button" onclick="submitLogout()"
                class="px-2.5 sm:px-3 py-1.5 bg-[#121212] border border-[#262626] hover:border-red-800/60 hover:text-red-400 text-neutral-300 text-xs font-bold rounded transition-colors flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
                <span>Keluar</span>
            </button>
        </div>
    </div>
</header>
