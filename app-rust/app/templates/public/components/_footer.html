<!--
  _footer.html — Shared footer component
  Variabel yang dibutuhkan:
    - warnet_title : string — Nama warnet
    - footer_label : string — Label kanan, contoh: "E-Sports & Gaming Arena" atau "Portal Member"
-->

<footer class="w-full bg-[#080808] border-t border-[#1c1c1c] py-4 px-3 sm:px-6 lg:px-8 mt-auto font-mono text-[11px] text-neutral-600">
    <div class="max-w-7xl 2xl:max-w-[1536px] mx-auto flex flex-col sm:flex-row items-center justify-between gap-1.5 text-center sm:text-left">
        <div>{{ warnet_title }} - {{ footer_label }}</div>
        <div>TMBilling {{ version }} &copy; 2026</div>
    </div>
</footer>
