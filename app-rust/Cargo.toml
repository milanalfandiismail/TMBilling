[package]
name = "tmbilling-server"
version = "2.0.1"
edition = "2021"

[lib]
name = "tmbilling_server"
path = "src/lib.rs"

[[bin]]
name = "tmbilling-server"
path = "src/main.rs"

[[test]]
name = "report_test"
path = "tests/contract/report_test.rs"

[[test]]
name = "cache_test"
path = "tests/unit/cache_test.rs"

[[test]]
name = "settings_test"
path = "tests/contract/settings_test.rs"

[[test]]
name = "auth_test"
path = "tests/contract/auth_test.rs"

[[test]]
name = "http_test"
path = "tests/contract/http_test.rs"

[[test]]
name = "config_test"
path = "tests/unit/config_test.rs"

[[test]]
name = "logger_test"
path = "tests/unit/logger_test.rs"

[[test]]
name = "schema_parity_test"
path = "tests/unit/schema_parity_test.rs"

[[test]]
name = "idempotency_test"
path = "tests/unit/idempotency_test.rs"

[[test]]
name = "sesi_test"
path = "tests/contract/sesi_test.rs"

[[test]]
name = "master_data_test"
path = "tests/contract/master_data_test.rs"

[dependencies]
printpdf = "0.7"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rand = "0.9"
flate2 = "1"
tracing = "0.1"
ammonia = "4"
axum = { version = "0.8", features = ["multipart", "ws"] }
rust-embed = "8"
minijinja = "2"
fs2 = "0.4"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
scrypt = "0.11"
pbkdf2 = "0.12"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[[test]]
name = "member_shift_notes_test"
path = "tests/contract/member_shift_notes_test.rs"

[[test]]
name = "client_agent_test"
path = "tests/contract/client_agent_test.rs"

[[test]]
name = "device_test"
path = "tests/contract/device_test.rs"

[[test]]
name = "public_cms_test"
path = "tests/contract/public_cms_test.rs"

[[test]]
name = "ops_test"
path = "tests/contract/ops_test.rs"

[[test]]
name = "scheduler_test"
path = "tests/unit/scheduler_test.rs"
