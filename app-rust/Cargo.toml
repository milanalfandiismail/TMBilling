[package]
name = "tmbilling-server"
version = "2.0.0"
edition = "2021"

[lib]
name = "tmbilling_server"
path = "src/lib.rs"

[[bin]]
name = "tmbilling-server"
path = "src/main.rs"

[[test]]
name = "http_test"
path = "tests/contract/http_test.rs"

[[test]]
name = "config_test"
path = "tests/unit/config_test.rs"

[[test]]
name = "logger_test"
path = "tests/unit/logger_test.rs"

[[test]]
name = "schema_parity_test"
path = "tests/unit/schema_parity_test.rs"

[[test]]
name = "idempotency_test"
path = "tests/unit/idempotency_test.rs"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rand = "0.9"
flate2 = "1"
tracing = "0.1"
axum = "0.8"
rust-embed = "8"
minijinja = "2"
fs2 = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
