[package]
name = "tmbilling-server"
version = "2.0.0"
edition = "2021"

[lib]
name = "tmbilling_server"
path = "src/lib.rs"

[[bin]]
name = "tmbilling-server"
path = "src/main.rs"

[[test]]
name = "cache_test"
path = "tests/unit/cache_test.rs"

[[test]]
name = "settings_test"
path = "tests/contract/settings_test.rs"

[[test]]
name = "auth_test"
path = "tests/contract/auth_test.rs"

[[test]]
name = "http_test"
path = "tests/contract/http_test.rs"

[[test]]
name = "config_test"
path = "tests/unit/config_test.rs"

[[test]]
name = "logger_test"
path = "tests/unit/logger_test.rs"

[[test]]
name = "schema_parity_test"
path = "tests/unit/schema_parity_test.rs"

[[test]]
name = "idempotency_test"
path = "tests/unit/idempotency_test.rs"

[[test]]
name = "master_data_test"
path = "tests/contract/master_data_test.rs"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rand = "0.9"
flate2 = "1"
tracing = "0.1"
ammonia = "4"
axum = { version = "0.8", features = ["multipart"] }
rust-embed = "8"
minijinja = "2"
fs2 = "0.4"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
scrypt = "0.11"
pbkdf2 = "0.12"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
