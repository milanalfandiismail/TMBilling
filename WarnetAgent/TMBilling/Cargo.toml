[package]
name = "tmbilling"
version = "2.0.0"
edition = "2021"

[[bin]]
name = "TMBilling"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
once_cell = "1"
configparser = "3.1"
winreg = "0.55"
mac_address = "1.1"
local-ip-address = "0.6"
screenshots = "0.8"
raw-window-handle = "0.6"
tray-icon = "0.19"
single-instance = "0.3"
rodio = { version = "0.20", features = ["mp3"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[build-dependencies]
winresource = "0.1"
