<!-- 2. BILLING OVERLAY (MODE MELAYANG - 1 CARD UTUH UNIFIED & RESPONSIF) -->
<div id="billing-overlay" class="hidden w-full h-full p-0 flex justify-end items-start bg-transparent overflow-hidden select-none">
    
    <!-- 1 CARD PANEL UTUH (KOLOM KIRI: PROPERTIES + QRIS HD | KOLOM KANAN: SESI WAKTU LENGKAP) -->
    <div class="relative w-[600px] sm:w-[680px] bg-card border border-[#2a2a2a] rounded-2xl p-5 shadow-2xl flex gap-6">
        
        <!-- KOLOM KIRI: PROPERTIES DI ATAS, QRIS BESAR HD DI BAWAH -->
        <div class="w-[270px] sm:w-[310px] shrink-0 flex flex-col justify-between">
            
            <!-- TITIK 1: PROPERTIES (GRID 2X2) -->
            <div id="overlay-properties-bar" class="flex flex-col">
                <div class="flex items-center gap-2 mb-3">
                    <div class="w-1.5 h-1.5 rounded-full bg-accent animate-pulse"></div>
                    <span class="text-[10px] font-bold text-accent uppercase tracking-wider">Properties</span>
                </div>

                <!-- Grid 2 Kolom untuk Tombol Control Panel -->
                <div class="grid grid-cols-2 gap-2">
                    <!-- Mouse Properties -->
                    <button id="btn-prop-mouse" type="button" title="Mouse Properties (DPI & Pointer)"
                        class="flex items-center gap-2 px-2.5 py-2 rounded-xl bg-white/5 hover:bg-accent/20 border border-white/5 hover:border-accent/40 text-neutral-300 hover:text-accent transition-all text-xs font-bold group">
                        <svg class="w-3.5 h-3.5 shrink-0 text-accent group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <rect x="6" y="3" width="12" height="18" rx="6" stroke-width="2"/>
                            <line x1="12" y1="7" x2="12" y2="11" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        <span class="text-[11px] font-semibold tracking-wide">Mouse</span>
                    </button>

                    <!-- Sound Properties -->
                    <button id="btn-prop-sound" type="button" title="Sound / Speaker Properties (Playback & Mic)"
                        class="flex items-center gap-2 px-2.5 py-2 rounded-xl bg-white/5 hover:bg-accent/20 border border-white/5 hover:border-accent/40 text-neutral-300 hover:text-accent transition-all text-xs font-bold group">
                        <svg class="w-3.5 h-3.5 shrink-0 text-accent group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                        </svg>
                        <span class="text-[11px] font-semibold tracking-wide">Sound</span>
                    </button>

                    <!-- Volume Mixer -->
                    <button id="btn-prop-volume" type="button" title="Volume Mixer (Pengatur Suara Aplikasi)"
                        class="flex items-center gap-2 px-2.5 py-2 rounded-xl bg-white/5 hover:bg-accent/20 border border-white/5 hover:border-accent/40 text-neutral-300 hover:text-accent transition-all text-xs font-bold group">
                        <svg class="w-3.5 h-3.5 shrink-0 text-accent group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                        </svg>
                        <span class="text-[11px] font-semibold tracking-wide">Volume</span>
                    </button>

                    <!-- Display Settings -->
                    <button id="btn-prop-display" type="button" title="Display / Layar (Resolusi & Refresh Rate Hz)"
                        class="flex items-center gap-2 px-2.5 py-2 rounded-xl bg-white/5 hover:bg-accent/20 border border-white/5 hover:border-accent/40 text-neutral-300 hover:text-accent transition-all text-xs font-bold group">
                        <svg class="w-3.5 h-3.5 shrink-0 text-accent group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <rect x="2" y="3" width="20" height="14" rx="2" stroke-width="2"/>
                            <line x1="8" y1="21" x2="16" y2="21" stroke-width="2" stroke-linecap="round"/>
                            <line x1="12" y1="17" x2="12" y2="21" stroke-width="2"/>
                        </svg>
                        <span class="text-[11px] font-semibold tracking-wide">Display</span>
                    </button>
                </div>
            </div>

            <!-- TITIK 3: QRIS PEMBAYARAN BESAR & HD -->
            <div id="overlay-qris-box" class="flex flex-col items-center pt-3">
                <div class="w-full flex items-center mb-2 px-1">
                    <div class="flex items-center gap-1.5">
                        <div class="w-1.5 h-1.5 rounded-full bg-accent animate-pulse"></div>
                        <span class="text-[10px] font-extrabold text-accent uppercase tracking-wider">QRIS Pembayaran</span>
                    </div>
                </div>

                <!-- Kontainer Gambar QRIS Ekstra Besar HD -->
                <div class="w-[230px] h-[230px] sm:w-[260px] sm:h-[260px] bg-white rounded-2xl p-2.5 flex items-center justify-center shadow-xl border border-white/20">
                    <img id="overlay-qris-img" src="" alt="QRIS Code" class="w-full h-full object-contain [image-rendering:crisp-edges]">
                    <div id="overlay-qris-fallback" class="hidden text-center text-neutral-600">
                        <div class="text-4xl font-black font-mono">?</div>
                        <div class="text-[10px] font-bold uppercase tracking-wider mt-1">QRIS Offline</div>
                    </div>
                </div>
            </div>

        </div>

        <!-- KOLOM KANAN: TITIK 2 (SESI AKTIF UTUH PERSIS SEPERTI SEBELUMNYA) -->
        <div id="overlay-time-box" class="flex-1 flex flex-col justify-between">
            
            <!-- Bagian Atas: Header & Info Sesi -->
            <div>
                <div class="flex justify-between items-start mb-5">
                    <div class="flex items-center gap-2">
                        <div class="w-1.5 h-1.5 rounded-full bg-accent animate-pulse"></div>
                        <span class="text-[10px] font-bold text-accent uppercase tracking-wider">Sesi Aktif</span>
                    </div>
                    <button id="minimize-btn" title="Minimize ke Tray"
                        class="p-1.5 hover:bg-white/10 rounded-lg text-white/40 hover:text-white transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" />
                        </svg>
                    </button>
                </div>

                <div class="space-y-3.5 text-xs">
                    <div class="flex items-center">
                        <span class="text-[10px] font-bold text-neutral-500 uppercase tracking-wider w-20">Nama PC</span>
                        <span class="text-[13px] font-bold pc-name-display" id="overlay-pc-name">PC-01</span>
                    </div>
                    <div class="flex items-center">
                        <span class="text-[10px] font-bold text-neutral-500 uppercase tracking-wider w-20">Grup</span>
                        <span class="text-[13px] font-bold text-accent uppercase" id="overlay-group">: TM</span>
                    </div>
                    <div class="flex items-center">
                        <span class="text-[10px] font-bold text-neutral-500 uppercase tracking-wider w-20">Member</span>
                        <span class="text-[13px] font-bold truncate" id="overlay-member-name">: -</span>
                    </div>
                    <div class="space-y-1 pt-4">
                        <span class="text-[9px] font-bold text-accent/70 uppercase tracking-wider">Sisa Waktu</span>
                        <p class="text-3xl font-black tracking-tight text-white whitespace-nowrap font-mono" id="overlay-time">00:00:00</p>
                    </div>
                </div>
            </div>

            <!-- Tombol Akhiri Sesi di Paling Bawah (Sejajar dengan Dasar QRIS) -->
            <button id="logout-btn"
                class="w-full bg-[#1a1a1a] hover:bg-red-650/10 border border-[#2a2a2a] hover:border-red-500/30 py-3 rounded-xl flex items-center justify-center gap-2 transition-all text-neutral-400 hover:text-red-400 mt-6">
                <span class="text-[10px] font-bold uppercase tracking-wider">Akhiri Sesi</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z"
                        clip-rule="evenodd" />
                </svg>
            </button>

        </div>

        <!-- 4. MODAL KONFIRMASI LOGOUT (ABSOLUTE PAS DI TENGAH 1 CARD UTUH) -->
        <div id="logout-confirm-modal"
            class="hidden absolute inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md rounded-2xl p-6 animate-in fade-in duration-200">
            <div class="w-[280px] bg-[#181818] border border-[#2a2a2a] rounded-2xl p-5 shadow-2xl space-y-4 text-center">
                <header class="flex flex-col items-center">
                    <div class="w-10 h-10 bg-red-500/10 rounded-full flex items-center justify-center mb-2 text-red-500">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                    </div>
                    <h2 class="text-base font-bold text-white">Akhiri Sesi?</h2>
                    <p class="text-[10px] text-neutral-400 mt-0.5 uppercase tracking-wider font-bold">Yakin ingin keluar?</p>
                </header>

                <div class="flex gap-2 pt-1">
                    <button id="logout-cancel-btn" type="button"
                        class="flex-1 bg-[#222] border border-[#333] hover:bg-[#2a2a2a] py-2.5 rounded-xl text-[10px] font-bold uppercase tracking-wider text-neutral-300 transition-all">Tidak</button>
                    <button id="logout-confirm-btn" type="button"
                        class="flex-1 bg-red-650/10 hover:bg-red-600 border border-red-500/20 py-2.5 rounded-xl text-[10px] font-bold uppercase tracking-wider text-red-400 hover:text-white transition-all shadow-lg shadow-red-950/50">Ya</button>
                </div>
            </div>
        </div>

    </div>

</div>
