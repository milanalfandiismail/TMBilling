<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMBilling Client</title>

    <!-- External Assets -->
    <link rel="stylesheet" href="css/output.css">
</head>

<body class="bg-transparent" oncontextmenu="return false">

    <!-- 1. LAYAR LOGIN (MODE KIOSK) -->
    <div id="login-screen"
        class="w-full h-screen p-4 lg:p-5 xl:p-6 2xl:p-8 flex flex-col gap-4 lg:grid lg:grid-cols-3 lg:grid-rows-3 lg:gap-5 xl:gap-6 2xl:gap-8 overflow-hidden bg-cover bg-center">

        <!-- div2: Panel Aturan & Daftar Paket -->
        <div class="kiosk-info order-2 lg:order-none lg:col-start-1 lg:row-start-1 lg:row-span-3 flex flex-col gap-4 lg:gap-6 z-10 h-full">
            <!-- Brand / Nama Warnet (Top Left) -->
            <div class="flex flex-col gap-1 shrink-0">
                <h1 id="kiosk-title" class="text-2xl lg:text-3xl font-black uppercase tracking-wider text-white">
                    TMBilling</h1>
                <div class="w-12 lg:w-16 h-1 bg-accent rounded-full"></div>
            </div>

            <!-- Informasi Card (Tab: Aturan Warnet | Daftar Paket) -->
            <div
                class="premium-cyber-card border border-[#2a2a2a] rounded-3xl p-5 lg:p-6 shadow-2xl flex flex-col justify-between flex-1 min-h-0 backdrop-blur-md bg-opacity-90">
                <!-- Tab Header -->
                <div class="flex gap-2 mb-3">
                    <button id="tab-rules-btn"
                        class="flex-1 px-4 py-2 bg-white/10 border border-white/10 text-xs lg:text-sm font-bold rounded-xl text-white transition-all shadow-sm">Aturan
                        Warnet</button>
                    <button id="tab-packages-btn"
                        class="flex-1 px-4 py-2 bg-white/5 border border-white/5 text-xs lg:text-sm font-bold rounded-xl text-neutral-400 hover:text-white hover:bg-white/10 transition-all">Daftar
                        Paket</button>
                </div>

                <!-- Tab Content: Rules Panel -->
                <div id="panel-rules" class="flex-1 flex flex-col min-h-0">
                    <div id="rules-container"
                        class="flex-1 overflow-y-auto text-xs lg:text-sm text-neutral-300 space-y-2.5 pr-2.5 scrollbar-thin leading-relaxed">
                        <p class="text-neutral-500 text-xs lg:text-sm">Memuat aturan...</p>
                    </div>

                    <div id="rules-pagination"
                        class="mt-3 pt-3 border-t border-white/10 flex items-center justify-between font-mono text-xs lg:text-sm">
                        <button id="rules-prev-btn"
                            class="px-3.5 py-1.5 bg-white/5 hover:bg-white/15 border border-white/10 hover:border-accent/40 text-neutral-300 hover:text-white rounded-xl transition-all font-bold disabled:opacity-20 disabled:pointer-events-none flex items-center gap-1.5 shadow-sm"
                            disabled>&larr; Prev</button>
                        <span id="rules-page-indicator"
                            class="px-3.5 py-1 bg-white/5 border border-accent/20 rounded-xl text-accent font-bold tracking-wider shadow-inner text-xs lg:text-sm">1 / 1</span>
                        <button id="rules-next-btn"
                            class="px-3.5 py-1.5 bg-white/5 hover:bg-white/15 border border-white/10 hover:border-accent/40 text-neutral-300 hover:text-white rounded-xl transition-all font-bold disabled:opacity-20 disabled:pointer-events-none flex items-center gap-1.5 shadow-sm"
                            disabled>Next &rarr;</button>
                    </div>
                </div>

                <!-- Tab Content: Packages Panel -->
                <div id="panel-packages" class="flex-1 flex flex-col min-h-0 hidden">
                    <!-- Group Tabs -->
                    <div id="paket-tabs" class="flex gap-2 overflow-x-auto pb-2 scrollbar-thin mb-3">
                        <!-- Dynamic tabs go here -->
                    </div>

                    <!-- Packages List -->
                    <div id="paket-list-container" class="flex-1 flex flex-col gap-2 justify-start overflow-y-auto pr-2.5 scrollbar-thin">
                        <p class="text-xs lg:text-sm text-neutral-500">Memuat paket...</p>
                    </div>

                    <!-- Pagination Controls -->
                    <div id="paket-pagination"
                        class="mt-3 pt-3 border-t border-white/10 flex items-center justify-between font-mono text-xs lg:text-sm">
                        <button id="paket-prev-btn"
                            class="px-3.5 py-1.5 bg-white/5 hover:bg-white/15 border border-white/10 hover:border-accent/40 text-neutral-300 hover:text-white rounded-xl transition-all font-bold disabled:opacity-20 disabled:pointer-events-none flex items-center gap-1.5 shadow-sm"
                            disabled>&larr; Prev</button>
                        <span id="paket-page-indicator"
                            class="px-3.5 py-1 bg-white/5 border border-accent/20 rounded-xl text-accent font-bold tracking-wider shadow-inner text-xs lg:text-sm">1 / 1</span>
                        <button id="paket-next-btn"
                            class="px-3.5 py-1.5 bg-white/5 hover:bg-white/15 border border-white/10 hover:border-accent/40 text-neutral-300 hover:text-white rounded-xl transition-all font-bold disabled:opacity-20 disabled:pointer-events-none flex items-center gap-1.5 shadow-sm"
                            disabled>Next &rarr;</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- div1: Login Form (Center) -->
        <div class="kiosk-login order-1 lg:order-none lg:col-start-2 lg:row-start-2 flex items-center justify-center z-10 w-full">
            <div
                class="premium-cyber-card kiosk-login-card border border-[#2a2a2a] rounded-3xl p-6 lg:p-8 xl:p-10 shadow-2xl flex flex-col w-full max-w-xl backdrop-blur-md bg-opacity-90 transition-all">
                <header class="space-y-1 mb-4 xl:mb-5">
                    <div class="flex items-center gap-2 mb-2">
                        <div class="w-1.5 h-1.5 rounded-full bg-accent animate-pulse"></div>
                        <span class="text-xs lg:text-sm font-bold tracking-widest text-accent uppercase">Sistem
                            Terkunci</span>
                    </div>
                    <h2 class="text-2xl lg:text-3xl xl:text-4xl font-extrabold tracking-tight text-white">Nama PC :
                        <span class="text-accent pc-name-display">PC-01</span>
                    </h2>
                </header>

                <div class="space-y-3 lg:space-y-4 flex flex-col justify-center">
                    <input type="text" id="username" placeholder="Username"
                        class="w-full bg-white/5 border border-[#2a2a2a] rounded-xl px-4 py-3 xl:px-5 xl:py-4 text-sm xl:text-base outline-none focus:border-accent focus:bg-white/10 transition-all text-white">
                    <input type="password" id="password" placeholder="Password"
                        class="w-full bg-white/5 border border-[#2a2a2a] rounded-xl px-4 py-3 xl:px-5 xl:py-4 text-sm xl:text-base outline-none focus:border-accent focus:bg-white/10 transition-all text-white">
                    <button id="login-btn"
                        class="w-full premium-btn text-black rounded-xl py-3.5 xl:py-4 mt-2 xl:mt-3 font-bold text-sm tracking-wider transition-all">Mulai
                        Sesi</button>
                </div>
            </div>
        </div>

        <!-- div3: QRIS Image -->
        <div class="kiosk-qris order-3 lg:order-none lg:col-start-3 lg:row-start-1 lg:row-span-2 flex flex-col z-10 h-full">
            <div
                class="premium-cyber-card border border-[#2a2a2a] rounded-3xl p-5 shadow-2xl backdrop-blur-md bg-opacity-90 flex-1 flex flex-col items-center justify-center">
                <header class="flex items-center gap-2 mb-3 self-start">
                    <div class="w-1.5 h-1.5 rounded-full bg-accent animate-pulse"></div>
                    <span class="text-xs lg:text-sm font-bold tracking-widest text-accent uppercase">Pembayaran</span>
                </header>
                <div class="flex-1 flex items-center justify-center w-full overflow-hidden">
                    <img id="kiosk-qris-img" src="" alt="QRIS Code" class="w-full h-full object-contain rounded-lg">
                </div>
                <p class="text-center text-xs lg:text-sm text-neutral-400 mt-2 font-semibold">Scan QRIS untuk bayar</p>
            </div>
        </div>

        <!-- div4: Footer Info (Baru) -->
        <div class="kiosk-footer order-4 lg:order-none lg:col-start-3 lg:row-start-3 flex flex-col z-10 justify-end h-full">
            <div class="premium-cyber-card border border-[#2a2a2a] rounded-3xl p-5 shadow-2xl backdrop-blur-md bg-opacity-90 flex flex-col justify-between h-full">
                <div class="flex justify-between items-start text-neutral-400 font-mono text-xs lg:text-sm">
                    <div class="space-y-1">
                        <p>IP Address: <span id="ip-display" class="text-neutral-200 font-semibold">Memuat...</span></p>
                        <p>Mac Address: <span id="mac-display" class="text-neutral-200 font-semibold">Memuat...</span></p>
                    </div>
                    <div class="text-right text-accent font-bold">
                        <p id="shutdown-status" class="tracking-wider text-xs uppercase font-bold text-accent">Off</p>
                        <p id="shutdown-countdown" class="text-2xl lg:text-3xl xl:text-4xl text-white font-mono font-black">--:--</p>
                    </div>
                </div>
                <div class="mt-4 pt-4 border-t border-white/5 flex justify-between items-center text-xs lg:text-sm text-neutral-400 font-bold">
                    <span class="font-bold tracking-wider uppercase text-neutral-500">Client Version</span>
                    <span id="client-version-display" class="font-bold text-neutral-200">TMBilling v...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- OVERLAY DYNAMICALLY INJECTED HERE -->
    <div id="overlay-container"></div>

    <!-- 3. MODAL LOGIN ADMIN -->
    <div id="admin-modal"
        class="hidden fixed inset-0 z-[999] flex items-center justify-center bg-black/80 backdrop-blur-sm animate-in fade-in duration-300">
        <div class="w-[360px] bg-card border border-[#2a2a2a] rounded-2xl p-8 shadow-2xl space-y-6">
            <header>
                <div class="flex items-center gap-2 mb-1">
                    <div class="w-1.5 h-1.5 rounded-full bg-accent animate-pulse"></div>
                    <span class="text-[9px] font-bold tracking-widest text-accent uppercase">Admin Access</span>
                </div>
                <h2 class="text-xl font-bold">Log-in Sistem</h2>
            </header>

            <div class="space-y-3">
                <input type="text" id="admin-user" placeholder="Admin Username"
                    class="w-full bg-white/5 border border-[#2a2a2a] rounded-xl px-5 py-3.5 text-sm outline-none focus:border-neutral-400 focus:bg-white/10 transition-colors">
                <input type="password" id="admin-pass" placeholder="Admin Password"
                    class="w-full bg-white/5 border border-[#2a2a2a] rounded-xl px-5 py-3.5 text-sm outline-none focus:border-neutral-400 focus:bg-white/10 transition-colors">
                <div id="admin-error" class="text-[10px] text-red-400 hidden">Username atau Password salah!</div>
            </div>

            <div class="flex gap-3 pt-2">
                <button id="admin-close-btn"
                    class="flex-1 bg-[#1a1a1a] border border-[#2a2a2a] hover:bg-[#222] py-3 rounded-xl text-[10px] font-bold uppercase tracking-wider text-neutral-400 transition-all">Batal</button>
                <button id="admin-login-confirm-btn"
                    class="flex-1 bg-white hover:bg-neutral-200 text-black py-3 rounded-xl text-[10px] font-bold uppercase tracking-wider transition-all">Masuk</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-10 right-10 z-[9999] space-y-3 pointer-events-none"></div>

    <script type="module" src="/main.js"></script>
</body>

</html>
